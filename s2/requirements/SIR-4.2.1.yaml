# ------------------------------------------------------------------------------
#  SIR-4.2.1 · A test or live-fire event of an adversary counter-air system with stated range, altitude, or engagement performance
#
#  PIR-4: Adversary capabilities that specifically threaten rotary-wing
#         operations (What can the adversary field that would kill or degrade
#         our helicopters?)
#  IND-4.2: What capability has been demonstrated?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-4.2.1
title: 'A test or live-fire event of an adversary counter-air system with stated range, altitude, or engagement performance'
status: draft
modified: '2026-10-20'
fact: 'A test or live-fire event of an adversary counter-air system with stated range, altitude, or engagement performance.'
logsource:
  scope: any
  kind: any
detection:
  # THE SYSTEM, THE TEST AND THE ADVERSARY ARE READ IN THE TITLE; THE FIGURE
  # STAYS IN THE BODY, because a headline rarely carries the number. Measured
  # 2026-10-17 over 1,911 articles in 45 days, with the shipped rule as the
  # control:
  #
  #   all three conjuncts in the body, the rule this replaces   94
  #   system and test in the title                               6
  #   the same with an adversary required, this rule             4
  #
  # All were read. The four this rule keeps are PLA tests: HQ-9 live fire in
  # the Gobi, the HQ-9B redeployment drill, and the laser and microwave
  # counter-drone drill (twice). The two it drops are a Taiwanese
  # counter-drone drill.
  #
  # The figure is a pattern in the `{match, scope}` form ON PURPOSE. Written
  # bare with a sibling `scope:`, the engine ignores the scope and reads the
  # whole article, which was harmless here only because blob is the default.
  system:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - {group: threat_manpads_generic, scope: title}
    - {group: threat_sam_generic, scope: title}
    - {group: threat_aaa_cuas_generic, scope: title}
    - {group: threat_ew_generic, scope: title}
    - {group: threat_uas_loitering_generic, scope: title}
    - keywords: [air defense, air defence, air-defense, air-defence,
                 anti-aircraft, antiaircraft, SAM, interceptor, anti-drone,
                 counter-drone]
      scope: title
  test_event:
    keywords: [test, tests, tested, testing, test-fired, test fires, test-fires,
               test launch, live-fire, live fire, firing test, trial, trials,
               intercept test, demonstrates, demonstrated, demonstration,
               exercise, drill, drills]
    scope: title
  stated_figure:
    pattern:
      match: '\b\d{1,4}(\.\d+)?\s?(km|kilometre|kilometres|kilometer|kilometers|nm|nautical mile|nautical miles|mile|miles|m|metre|metres|meter|meters|ft|feet|mach)\b'
      scope: blob
  # THE ADVERSARY, decided 2026-10-20: PIR-4 asks what the ADVERSARY can field.
  # Either a named adversary designation in the title (HQ-9, Pantsir and the like
  # are in the designation groups) or an adversary as the first word of the
  # title, written as a pattern because the rule language has no other way to
  # say "at the start".
  adversary:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - pattern:
        match: '^(china|china''s|chinese|beijing|prc|pla|russia|russia''s|russian|moscow|kremlin|north korea|north korea''s|north korean|pyongyang|dprk|iran|iran''s|iranian|tehran|irgc)\b'
        scope: title
  condition: system and test_event and stated_figure and adversary
falsepositives:
- A FIGURE ANYWHERE IN THE BODY IS NOT A STATED PERFORMANCE FIGURE. The pattern matches
  any number beside a unit, such as a distance travelled to the test site. The first four
  matches were not checked for this.
- FIXED BY REQUIRING THE ADVERSARY, recorded so it is not reintroduced - 'AIDC, Agency of
  Corrections hold counter-drone drill' is a Taiwanese drill.
note: 'Scoring: Tier 2 × first-occurrence. WESTERN-ONLY, 2026-09-27: this fact is collected from western reporting of adversary activity. MEASURED AND TIGHTENED 2026-10-17: 94 articles of 1,911 down to 4, every match read. ADVERSARY REQUIRED 2026-10-20 by owner decision, and the title and fact now say so.'
