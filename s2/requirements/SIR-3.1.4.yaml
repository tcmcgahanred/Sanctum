id: SIR-3.1.4
title: 'Losses attributed to small arms or unguided fire rather than guided systems'
status: draft
modified: '2026-09-27'
fact: 'Losses attributed to small arms or unguided fire rather than guided systems.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: conflict OSINT — PARTIAL'
  status: 'PARTIAL'
detection:
  # UNGUIDED fire, which is the whole point of this requirement: it exists to
  # separate losses to small arms and anti-aircraft artillery from losses to
  # guided systems, because the two carry different lessons for the reader.
  unguided:
    any:
    - {group: threat_small_arms, scope: blob}
    - {group: threat_small_arms_generic, scope: blob}
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
  rotary:
    group: platform_rotary_wing
    scope: blob
  loss:
    group: conflict_markers
    scope: blob
  condition: rotary and loss and unguided
note: 'Converted from EEI-3.1.d. Scoring: Tier 3 DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
