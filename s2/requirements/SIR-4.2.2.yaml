id: SIR-4.2.2
title: 'Combat employment of a counter-air system against any rotary-wing target'
status: draft
modified: '2026-09-27'
fact: 'Combat employment of a counter-air system against any rotary-wing target.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: conflict OSINT — PARTIAL'
  status: 'PARTIAL'
detection:
  # EMPLOYMENT against a rotary-wing target, anywhere. This deliberately
  # overlaps SIR-3.1.1: that one requires a confirmed LOSS with the system
  # named, this one requires only that the system was used against a
  # rotary-wing aircraft. An article can answer both, and two requirements
  # answered by one article is not double counting - it is two facts.
  system:
    any:
    - {group: threat_manpads, scope: blob}
    - {group: threat_sam, scope: blob}
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_ew, scope: blob}
    - {group: threat_small_arms, scope: blob}
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_sa_designations, scope: blob}
    - {group: threat_manpads_generic, scope: blob}
    - {group: threat_sam_generic, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
    - {group: threat_ew_generic, scope: blob}
    - {group: threat_small_arms_generic, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
  rotary:
    group: platform_rotary_wing
    scope: blob
  employment:
    any:
    - {group: conflict_markers, scope: blob}
    - keywords: [fired at, fired on, engaged, engagement, shot at, launched at,
                 targeted, targeting of, intercepted]
      scope: blob
  condition: system and rotary and employment
note: 'Converted from EEI-4.2.b. Scoring: Tier 2 or Tier 3, whichever is higher DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
