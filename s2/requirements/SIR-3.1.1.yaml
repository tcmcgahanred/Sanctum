# ------------------------------------------------------------------------------
#  SIR-3.1.1 · A confirmed rotary-wing loss with the engaging system identified
#
#  PIR-3: What current conflicts show about rotary-wing survivability and
#         employment (What are helicopters in active conflicts teaching us
#         about how they survive and how they are being used?)
#  IND-3.1: How are rotary-wing aircraft being lost?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-3.1.1
title: 'A confirmed rotary-wing loss with the engaging system identified'
status: draft
modified: '2026-10-17'
fact: 'A confirmed rotary-wing loss with the engaging system identified.'
logsource:
  scope: any
  kind: any
detection:
  # THE HELICOPTER AND THE LOSS ARE READ IN THE TITLE. Measured 2026-10-17 over
  # 1,911 articles in 45 days, with the shipped rule as the control:
  #
  #   all three conjuncts in the body, the rule this replaces   111 articles
  #   helicopter and loss in the title, this rule                 22 articles
  #
  # All 111 were read. About 22 were the fact, and this rule keeps every one of
  # them and nothing else: one Russian Mi-8 shot down by its own air defence
  # (three reports), one Iranian claim of an Apache shot down, one fact-check of
  # a Houthi Apache video, and two Ukrainian drone kills of Russian Mi-28NM
  # helicopters (17 reports). The 89 it drops are long articles that mention a
  # helicopter, a weapon and a war word anywhere in the body.
  #
  # The engaging system stays in the BODY on purpose. Loss headlines name the
  # aircraft and the event; the weapon is usually named in the first paragraph.
  system:
    any:
    - {group: threat_manpads, scope: blob}
    - {group: threat_sam, scope: blob}
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_ew, scope: blob}
    - {group: threat_small_arms, scope: blob}
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_sa_designations, scope: blob}
    - {group: threat_manpads_generic, scope: blob}
    - {group: threat_sam_generic, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
    - {group: threat_ew_generic, scope: blob}
    - {group: threat_small_arms_generic, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
  rotary:
    group: platform_rotary_wing
    scope: title
  # The loss words are written inline because `conflict_markers` is a war-words
  # group, not a loss-words group: "war", "strike" and "combat" say a conflict
  # exists, not that an aircraft was lost.
  loss:
    keywords: [shot down, shoot down, shoots down, shooting down, downed,
               brought down, took it down, take down, takes down, taken out,
               strike, struck, strikes, hits, hit by, destroyed, destroys,
               destroy, crashed, friendly fire, hunts down, lost, losses]
    scope: title
  excl:
    keywords: [strike group, strike groups]
    scope: title
  condition: rotary and loss and system and not excl
falsepositives:
- A CLAIM IS NOT A CONFIRMATION. 'Trump vows US response after saying Iran shot down Apache
  helicopter' and 'Does the Video Show Houthis Shooting Down a Saudi Apache Helicopter?' both
  match. The requirement says confirmed; the rule cannot tell a confirmed loss from a claimed
  one, and the reader has to.
- ONE EVENT, MANY REPORTS. Two Mi-28NM kills produced 17 matches. The count is reports, not
  losses.
- FIXED BY THE TITLE SCOPING, recorded so it is not reintroduced by a future widening - a
  carrier "strike group" headline with a helicopter in it, and long feature articles that
  name a helicopter, a weapon and a war word anywhere in the body.
note: 'Scoring: Tier 3. MEASURED AND TIGHTENED 2026-10-17: 111 articles of 1,911 down to 22, the helicopter and the loss now read in the title, every match read, with the reading and the false positives written into the detection block.'
