id: SIR-3.1.1
title: 'A confirmed rotary-wing loss with the engaging system identified'
status: draft
modified: '2026-09-27'
fact: 'A confirmed rotary-wing loss with the engaging system identified.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: conflict OSINT + wire — PARTIAL'
  status: 'PARTIAL'
detection:
  # THREE CONJUNCTS, because the fact has three parts: a rotary-wing aircraft, a
  # loss, and the system that engaged it. The third is what separates this
  # requirement from SIR-4.2.2, which needs only employment.
  #
  # The engaging system is read from the designation lists FIRST and the generic
  # lists beside them. A designation is unambiguous - HQ-9 and Igla are not
  # ordinary words - and until 2026-09-27 not one of them could match anything,
  # because the engine compared a capitalised term to lowercased text.
  system:
    any:
    - {group: threat_manpads, scope: blob}
    - {group: threat_sam, scope: blob}
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_ew, scope: blob}
    - {group: threat_small_arms, scope: blob}
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_sa_designations, scope: blob}
    - {group: threat_manpads_generic, scope: blob}
    - {group: threat_sam_generic, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
    - {group: threat_ew_generic, scope: blob}
    - {group: threat_small_arms_generic, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
  rotary:
    group: platform_rotary_wing
    scope: blob
  loss:
    group: conflict_markers
    scope: blob
  condition: rotary and loss and system
note: 'Converted from EEI-3.1.a. Scoring: Tier 3 DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
