id: SIR-4.4.3
title: 'Counter-UAS capability that would defeat organic unmanned systems'
status: draft
modified: '2026-09-27'
fact: 'Counter-UAS capability that would defeat organic unmanned systems.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: trade press — PARTIAL'
  status: 'PARTIAL'
detection:
  # Counter-unmanned capability AND an unmanned aircraft to defeat. Both halves
  # are needed: the counter-UAS words alone match a procurement announcement
  # with no aircraft in it, and the drone words alone match half the corpus.
  counter_uas:
    any:
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
    - keywords: [counter-unmanned, counter unmanned, anti-drone, drone defence,
                 drone defense, UAS defeat, drone jammer, net gun, laser
                 dazzler, high-power microwave]
      scope: blob
  unmanned:
    any:
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
    - keywords: [UAS, UAV, drone, drones, unmanned aircraft, unmanned aerial,
                 quadcopter, fixed-wing drone, reconnaissance drone]
      scope: blob
  condition: counter_uas and unmanned
note: 'Converted from EEI-4.4.c. Scoring: Tier 2 DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
