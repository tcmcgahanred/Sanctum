# ==============================================================================
#  THE REQUIREMENTS TREE — second domain
#
#  THE NUMBERING, because the trailing comment block still speaks the old
#  language: an indicator IND-n.m was an SIR, and a requirement SIR-n.m.x was
#  EEI-n.m with the letter turned into a number.
#
#  KIQ-1, the enduring question that governs collection scope:
#    What risks and threats should the supported unit be aware of to
#    prepare for war in the INDOPACOM area of responsibility?
#
#  A PIR asks a question. An indicator STATES what would be true if the
#  answer were yes. A rule names one fact to collect.
#
#  `satisfied_by: any`  alternative routes to one fact; a missing one is
#                       thinner sourcing.
#  `satisfied_by: all`  components; a missing one is a hole.
#
#  EVERY indicator here is `any`, which is the conversion default and not
#  a judgement. s2/requirements.md never declared the distinction. Where
#  an indicator is really a set of components, change it deliberately.
#
#  Every identifier under `requirements:` must have a file beside this
#  one, and every file must be listed here. The loader refuses either way
#  round.
#
#  HOW TO WRITE ONE OF THE RULE FILES BESIDE THIS ONE
#
#  Copy the closest existing rule rather than starting from a skeleton; the one
#  you copy is live and tested. Each file carries only its own identifier and
#  title in its header, because this legend used to be repeated in every one of
#  them and a legend in seventy places is a legend nobody can correct.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in the
#                       manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be worked
#  off rather than excused. The coverage report says which, and "no detector" is
#  a build gap rather than a quiet week.
#
#  `detection:` is named blocks above and one `condition:` line below. A
#  `falsepositives:` list is written from what the detector actually matched,
#  never from argument. A detector that has not met the corpus is a proposal,
#  and its file says so.
# ==============================================================================
pirs:
- id: PIR-1
  name: 'Adversary posture and activity in the AOR'
  question: 'What shifts in adversary posture or activity have occurred in the AOR?'
  indicators:
  - id: IND-1.1
    statement: 'What forces or systems have moved into, out of, or within the AOR?'
    satisfied_by: any
    requirements:
    - SIR-1.1.1
