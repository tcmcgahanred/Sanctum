# ==============================================================================
#  THE REQUIREMENTS TREE — second domain
#
#  THE NUMBERING, because the trailing comment block still speaks the old
#  language: an indicator IND-n.m was an SIR, and a requirement SIR-n.m.x was
#  EEI-n.m with the letter turned into a number.
#
#  KIQ-1, the enduring question that governs collection scope:
#    What risks and threats should the supported unit be aware of to
#    prepare for war in the INDOPACOM area of responsibility?
#
#  A PIR asks a question. An indicator STATES what would be true if the
#  answer were yes. A rule names one fact to collect.
#
#  `satisfied_by: any`  alternative routes to one fact; a missing one is
#                       thinner sourcing.
#  `satisfied_by: all`  components; a missing one is a hole.
#
#  EVERY indicator here is `any`, which is the conversion default and not
#  a judgement. s2/requirements.md never declared the distinction. Where
#  an indicator is really a set of components, change it deliberately.
#
#  Every identifier under `requirements:` must have a file beside this
#  one, and every file must be listed here. The loader refuses either way
#  round.
#
#  HOW TO WRITE ONE OF THE RULE FILES BESIDE THIS ONE
#
#  Copy the closest existing rule rather than starting from a skeleton; the one
#  you copy is live and tested. Each file carries only its own identifier and
#  title in its header, because this legend used to be repeated in every one of
#  them and a legend in seventy places is a legend nobody can correct.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in the
#                       manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be worked
#  off rather than excused. The coverage report says which, and "no detector" is
#  a build gap rather than a quiet week.
#
#  `detection:` is named blocks above and one `condition:` line below. A
#  `falsepositives:` list is written from what the detector actually matched,
#  never from argument. A detector that has not met the corpus is a proposal,
#  and its file says so.
# ==============================================================================
pirs:
- id: PIR-1
  name: 'Adversary posture and activity in the AOR'
  question: 'What shifts in adversary posture or activity have occurred in the AOR?'
  indicators:
  - id: IND-1.1
    statement: 'What forces or systems have moved into, out of, or within the AOR?'
    satisfied_by: any
    requirements:
    - SIR-1.1.1
    - SIR-1.1.2
    - SIR-1.1.3
    - SIR-1.1.4
  - id: IND-1.2
    statement: 'What activity indicates a change in readiness?'
    satisfied_by: any
    requirements:
    - SIR-1.2.1
    - SIR-1.2.2
    - SIR-1.2.3
    - SIR-1.2.4
  - id: IND-1.3
    statement: 'What has the adversary declared?'
    satisfied_by: any
    requirements:
    - SIR-1.3.1
    - SIR-1.3.2
  - id: IND-1.4
    statement: 'What infrastructure change enables future operations?'
    satisfied_by: any
    requirements:
    - SIR-1.4.1
    - SIR-1.4.2
- id: PIR-2
  name: 'Environmental and basing factors degrading rotary-wing operations'
  question: 'What conditions in the AOR would degrade our ability to fly, sustain, or base rotary-wing aircraft?'
  indicators:
  - id: IND-2.1
    statement: 'What environmental conditions degrade aircraft performance or availability?'
    satisfied_by: any
    requirements:
    - SIR-2.1.1
    - SIR-2.1.2
    - SIR-2.1.3
    - SIR-2.1.4
  - id: IND-2.2
    statement: 'What basing constraints affect employment?'
    satisfied_by: any
    requirements:
    - SIR-2.2.1
    - SIR-2.2.2
    - SIR-2.2.3
    - SIR-2.2.4
  - id: IND-2.3
    statement: 'What has degraded existing infrastructure?'
    satisfied_by: any
    requirements:
    - SIR-2.3.1
- id: PIR-3
  name: 'What current conflicts show about rotary-wing survivability and employment'
  question: 'What are helicopters in active conflicts teaching us about how they survive and how they are being used?'
  indicators:
  - id: IND-3.1
    statement: 'How are rotary-wing aircraft being lost?'
    satisfied_by: any
    requirements:
    - SIR-3.1.1
    - SIR-3.1.2
    - SIR-3.1.3
    - SIR-3.1.4
  - id: IND-3.2
    statement: 'How is rotary wing being employed successfully?'
    satisfied_by: any
    requirements:
    - SIR-3.2.1
    - SIR-3.2.2
    - SIR-3.2.3
  - id: IND-3.3
    statement: 'What is threatening aircraft that are not flying?'
    satisfied_by: any
    requirements:
    - SIR-3.3.1
    - SIR-3.3.2
    - SIR-3.3.3
- id: PIR-4
  name: 'Adversary capabilities that specifically threaten rotary-wing operations'
  question: 'What can the adversary field that would kill or degrade our helicopters?'
  indicators:
  - id: IND-4.1
    statement: 'What systems have entered or are entering service?'
    satisfied_by: any
    requirements:
    - SIR-4.1.1
    - SIR-4.1.2
    - SIR-4.1.3
  - id: IND-4.2
    statement: 'What capability has been demonstrated?'
    satisfied_by: any
    requirements:
    - SIR-4.2.1
    - SIR-4.2.2
    - SIR-4.2.3
  - id: IND-4.3
    statement: 'Where are these systems proliferating?'
    satisfied_by: any
    requirements:
    - SIR-4.3.1
    - SIR-4.3.2
    - SIR-4.3.3
  - id: IND-4.4
    statement: 'What integration multiplies these capabilities?'
    satisfied_by: any
    requirements:
    - SIR-4.4.1
    - SIR-4.4.2
    - SIR-4.4.3
# ==============================================================================
#  THE SENSOR-BUILD ROADMAP, and the open findings that go with it.
#
#  Carried over from the deleted `s2/requirements.md`. Fifteen rule files beside
#  this one name an item below in `blocked_by:`, which is why it lives here and
#  is not deleted.
#
#  The coverage table that accompanied it is gone, and the reason is in
#  `logs/CHANGELOG.md` at 2026-09-27: every ACTIVE / PARTIAL / ABSENT tag in it
#  was reasoned from what the sensor set was expected to carry and none was ever
#  tested against collected output, which the table's own third finding said.
#  `tools/requirement_coverage.py --domain s2` measures the same thing from what
#  actually arrived.
# ==============================================================================
#
#  Each item is the essential means of collecting one or more requirements.
#  Priority is how much specificity it unlocks.
#
#  1. AVIATION PROFESSIONAL AND DOCTRINAL PRESS.
#     Unlocks the largest block of uncovered requirements in the domain. These
#     facts are discussed in aviation professional literature and almost nowhere
#     in general defence press. Highest priority: it is the only route to PIR-2
#     and to the analytical half of PIR-3. NINE RULE FILES NAME THIS ITEM.
#
#  2. CONFLICT OSINT - LOSS DOCUMENTATION.
#     Mainstream defence press reports rotary-wing losses patchily and without
#     the engaging system. Documentation accounts do it systematically.
#
#  3. ADVERSARY PRIMARY-SOURCE FEEDS - RETIRED 2026-09-27 BY THE OWNER'S
#     WESTERN-ONLY DECISION. It ranked third because the declared-intent
#     multiplier depends on it and western press reports declarations
#     second-hand, selectively and late. That cost is accepted. DO NOT
#     RE-ADD IT AS A SENSOR WITHOUT REOPENING THE DECISION.
#
#  4. HOST-NATION AND REGIONAL PRESS WITHIN THE AOR.
#     Basing access and infrastructure damage are reported locally well before
#     they reach wire services.
#
#  5. ENVIRONMENTAL AND METEOROLOGICAL SOURCES FOR THE AOR.
#     Likely requires structured data rather than a feed - see Finding 2.
#     ONE RULE FILE NAMES THIS ITEM.
#
#  6. IMAGERY-DERIVED ANALYSIS.
#     Already reached through one sensor. Broadening it improves the facts that
#     are visible before they are announced.
#
#  THE STANDING ASSESSMENT: this is a collection problem, not a scoring problem.
#  Ranking and tuning operate only on what already arrived; they cannot reveal a
#  requirement nothing is collecting against. The roadmap above is the real
#  remaining work in this domain.
#
# ------------------------------------------------------------------------------
#  OPEN FINDINGS - both unresolved, both Planning & Direction calls
# ------------------------------------------------------------------------------
#
#  FINDING 1 - RECURRENCE IS NOT EXPRESSIBLE IN PER-ITEM SCORING. Severity
#  medium. SIR-4.3.2 asks whether a system recurs in an area across multiple
#  reports. That is a longitudinal question. Scoring is per-item and per-cycle,
#  with no memory that a term's frequency is rising. The corpus supports the
#  analysis because it is permanent; the tooling does not perform it. Until it
#  exists, an analyst answers this by reading across editions.
#
#  FINDING 2 - SOME REQUIREMENTS MAY NOT BE FEED-SHAPED AT ALL. Severity medium.
#  Several uncovered requirements under PIR-2 describe conditions rather than
#  events - density altitude at a site, seasonal patterns, airfield capacity.
#  These are reference data, not news. A feed may be the wrong instrument, and
#  the honest answer may be that this requirement is served by a different
#  product entirely. Whether to build a sensor, accept the gap, or answer the
#  requirement outside Sanctum is a Planning & Direction call.
# ==============================================================================
