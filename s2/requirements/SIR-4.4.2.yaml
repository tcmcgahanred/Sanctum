id: SIR-4.4.2
title: 'Electronic warfare, GPS denial, or spoofing capability affecting aviation navigation'
status: draft
modified: '2026-09-27'
fact: 'Electronic warfare, GPS denial, or spoofing capability affecting aviation navigation or datalinks.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: trade press + analysis — PARTIAL'
  status: 'PARTIAL'
detection:
  # Electronic warfare that touches AVIATION navigation, which is the narrowing
  # this requirement asks for. The electronic warfare half is a declared group
  # in two forms, designations and generic language; the aviation half is inline
  # because no other requirement needs it in this shape.
  ew:
    any:
    - {group: threat_ew, scope: blob}
    - {group: threat_ew_generic, scope: blob}
  aviation:
    any:
    - {group: platform_rotary_wing, scope: blob}
    - {group: platform_fixed_wing, scope: blob}
    - keywords: [aviation, aircraft, aircrew, flight operations, navigation,
                 navigational, approach, airspace, air corridor, air route,
                 GPS, GNSS, position navigation and timing, PNT]
      scope: blob
  condition: ew and aviation
note: 'Converted from EEI-4.4.b. Scoring: Tier 2 DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
