# ------------------------------------------------------------------------------
#  SIR-4.1.1 · An adversary counter-air system moves from development to fielding or operational status
#
#  PIR-4: Adversary capabilities that specifically threaten rotary-wing
#         operations (What can the adversary field that would kill or degrade
#         our helicopters?)
#  IND-4.1: What systems have entered or are entering service?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-4.1.1
title: 'An adversary counter-air system moves from development to fielding or operational status'
status: draft
modified: '2026-10-20'
fact: 'An adversary counter-air system moves from development to fielding or operational status.'
logsource:
  scope: any
  kind: any
detection:
  # THE SYSTEM, THE FIELDING AND THE ADVERSARY ARE READ IN THE TITLE. Measured
  # 2026-10-17 over 1,911 articles in 45 days, with the shipped rule as the
  # control:
  #
  #   system and fielding words in the body, the rule this replaces   109
  #   system and fielding words in the title                           17
  #   the same with an adversary required, this rule                    4
  #
  # All were read. Thirteen of the 17 were United States, allied or Ukrainian
  # programmes, which PIR-4 does not ask about. Of the four this rule keeps,
  # three are the fact: the Chinese HQ-20 entering frontline service (twice)
  # and China's LD-2000 fielded by Pakistan.
  system:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - {group: threat_manpads_generic, scope: title}
    - {group: threat_sam_generic, scope: title}
    - {group: threat_aaa_cuas_generic, scope: title}
    - {group: threat_ew_generic, scope: title}
    - {group: threat_uas_loitering_generic, scope: title}
    - keywords: [air defense, air defence, air-defense, air-defence,
                 anti-aircraft, antiaircraft, SAM, interceptor, anti-drone,
                 counter-drone]
      scope: title
  fielding:
    keywords: [fielded, fielding, field, fields, deploys, deployed, deploy,
               delivers, delivered, enters service, entered service,
               entering service, frontline service, into service, in service,
               inducted, commissioned, operational, new generation,
               program of record, mass production, serial production, arrives,
               arrived, adopts, adopted, receives, received]
    scope: title
  # THE ADVERSARY, decided 2026-10-20: PIR-4 asks what the ADVERSARY can field.
  # Either a named adversary designation in the title (HQ-9, Pantsir and the like
  # are in the designation groups) or an adversary as the first word of the
  # title, written as a pattern because the rule language has no other way to
  # say "at the start".
  adversary:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - pattern:
        match: '^(china|china''s|chinese|beijing|prc|pla|russia|russia''s|russian|moscow|kremlin|north korea|north korea''s|north korean|pyongyang|dprk|iran|iran''s|iranian|tehran|irgc)\b'
        scope: title
  condition: system and fielding and adversary
falsepositives:
- A REDEPLOYMENT IS NOT A FIELDING. 'China Demonstrates Ability to Rapidly Redeploy HQ-9B
  Long Range Air Defences for Desert Warfare' matches on deploy. An existing system moved,
  not a new one fielded.
- THE SOURCE NAME IS PART OF THE TITLE. Google News headlines end in ' - Source Name', and
  a place or country in the source name satisfies a title conjunct. The rule language
  cannot exclude the suffix.
- FIXED BY REQUIRING THE ADVERSARY, recorded so it is not reintroduced - 'L3Harris
  Delivers First VAMPIRE Counter-Drone Systems to U.S. Army' and twelve more United
  States, allied and Ukrainian fielding stories.
note: 'Scoring: Tier 2 × first-occurrence. MEASURED AND TIGHTENED 2026-10-17: 109 articles of 1,911 down to 4, every match read. ADVERSARY REQUIRED 2026-10-20 by owner decision, and the title and fact now say so.'
