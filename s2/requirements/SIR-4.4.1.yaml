# ------------------------------------------------------------------------------
#  SIR-4.4.1 · Air defence networking, sensor fusion, or IADS integration reporting
#
#  PIR-4: Adversary capabilities that specifically threaten rotary-wing
#         operations (What can the adversary field that would kill or degrade
#         our helicopters?)
#  IND-4.4: What integration multiplies these capabilities?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-4.4.1
title: 'Air defence networking, sensor fusion, or IADS integration reporting'
status: draft
modified: '2026-10-17'
fact: 'Air defence networking, sensor fusion, or IADS integration reporting.'
logsource:
  scope: any
  kind: any
detection:
  # BOTH HALVES ARE READ IN THE TITLE. Measured 2026-10-17 over 1,911 articles
  # in 45 days, with the shipped rule as the control:
  #
  #   networking and adversary or theatre in the body, the rule this replaces  33
  #   both in the title, this rule                                              3
  #
  # All 33 were read. Two of the three this rule keeps are the fact: a
  # Chinese-origin FK-2000 air defence network in Turkmenistan, reported twice.
  # The third is a false positive, below.
  #
  # The adjectives Russian, North Korean and Iranian are written inline because
  # `actor_adversary` holds none of them. It gained `Chinese` on 2026-10-16, so
  # that one is now in both places, which is harmless.
  networking:
    keywords: [integrated air defence, integrated air defense, IADS,
               air defence network, air defense network, networked air defence,
               networked air defense, sensor fusion, data fusion,
               early warning network, kill chain, battle management,
               layered air defence, layered air defense, air defence stack,
               air-defence stack, air defense stack]
    scope: title
  whose:
    any:
    - {group: actor_adversary, scope: title}
    - {group: geo_indopacom, scope: title}
    - keywords: [Chinese, Russian, North Korean, Iranian]
      scope: title
  condition: networking and whose
falsepositives:
- THE SOURCE NAME IS PART OF THE TITLE. Aggregated headlines end in ' - Source Name', and
  'The US air defense network and interceptor missile resources in the Gulf region. -
  Vietnam.vn' matched the theatre group on the source name alone. The rule language cannot
  exclude the suffix.
- FIXED BY THE TITLE SCOPING, recorded so it is not reintroduced by a future widening -
  NATO and allied programme notes that mention China or Russia in the body.
note: 'Scoring: Tier 2. MEASURED AND TIGHTENED 2026-10-17: 33 articles of 1,911 down to 3, two the fact, with the reading and the false positives written into the detection block.'
