id: SIR-3.3.2
title: 'Loitering munition or FPV employment against parked or taxiing aircraft'
status: draft
modified: '2026-09-27'
fact: 'Loitering munition or FPV employment against parked or taxiing aircraft.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: conflict OSINT — PARTIAL'
  status: 'PARTIAL'
detection:
  # A loitering munition or first-person-view drone, an aircraft, and the
  # aircraft being ON THE GROUND. The third conjunct is what makes this
  # different from an air-to-air engagement, and it has no group of its own
  # because only this requirement asks for it - written inline, per the standing
  # rule that one user means the words live in the rule.
  uas:
    any:
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
  aircraft:
    any:
    - {group: platform_rotary_wing, scope: blob}
    - {group: platform_fixed_wing, scope: blob}
  on_the_ground:
    any:
    - keywords: [parked, taxiing, taxied, on the ground, in the open, unsheltered,
                 dispersal, revetment, hardened aircraft shelter, hangar,
                 parking apron, ramp space, flight line, hardstand]
      scope: blob
    - {group: env_basing, scope: blob}
  condition: uas and aircraft and on_the_ground
note: 'Converted from EEI-3.3.b. Scoring: Tier 3 × first-occurrence DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
