# ------------------------------------------------------------------------------
#  SIR-1.3.1 · A ministry, spokesman, or named leader states an intention, threat, warning, or red line
#
#  One requirement, one file. Converted on 2026-09-27 from the decomposition that
#  was s2/requirements.md, where this was EEI-1.3.a. That file is gone; its analysis
#  is the comment block at the end of _tree.yaml. The `fact` below is the
#  original sentence, verbatim.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  THE `detection:` BLOCK BELOW IS A PROPOSAL, written 2026-09-27, and it has
#  NOT MET THE CORPUS. cti wrote its eighteen detectors one at a time and read
#  what each one matched before trusting it; this one has not had that pass, so
#  any coverage number it produces is a number nobody has checked yet.
# ------------------------------------------------------------------------------

id: SIR-1.3.1
title: 'A ministry, spokesman, or named leader states an intention, threat, warning, or red line'
status: draft
modified: '2026-09-27'
fact: 'A ministry, spokesman, or named leader states an intention, threat, warning, or red line.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: adversary primary-source — PARTIAL'
  status: 'PARTIAL'
detection:
  # DECLARED INTENT plus whose intent it is. This is the shape the scoring model
  # already uses for this fact - the note below records it as "any tier times
  # declared intent" - so the detector reads the same two groups.
  #
  # `declaration_terms` carries the spokesman and ministry phrasings as well as
  # the warning verbs, which is why a second conjunct on the actor is enough to
  # keep a western think-tank piece about somebody else out.
  declaration:
    group: declaration_terms
    scope: blob
  # THE ADJECTIVE IS MISSING FROM THE GROUP, found while testing this detector
  # on 2026-09-27. `actor_adversary` declares 52 terms and every one is a noun:
  # China, PRC, Beijing, PLA, Russian Federation, Korean People's Army. It holds
  # no `Chinese`, no `Russian`, no `North Korean`, no bare `Iranian` - and
  # `China` is in `word_boundary_terms`, so it cannot match inside `Chinese`
  # either. A headline reading "Chinese defence ministry warned Taipei" matched
  # NO adversary term at all.
  #
  # The adjectives are written INLINE HERE rather than added to the group on
  # purpose: `actor_adversary` is read by tier 1 and tier 2, so adding four
  # terms to it is a SCORING change and has to be measured against the corpus
  # first. A detector moves no score, so it can be correct today while that
  # measurement waits. Recorded as a finding in logs/CHANGELOG.md.
  actor:
    any:
    - {group: actor_adversary, scope: blob}
    - keywords: [Chinese, Russian, North Korean, Iranian]
      scope: blob
  condition: declaration and actor
note: 'Converted from EEI-1.3.a. Scoring: any tier × declared intent. WESTERN-ONLY, 2026-09-27: this rule asked for the adversary vantage and now accepts any. Measured before the change - the adversary vantage matched 1 of the 7 declared sensors, china-arms.com, which returned 21 articles in 41 days. The owner decided not to pursue adversary primary sources, so this fact is collected from western reporting of adversary statements and activity instead. DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
