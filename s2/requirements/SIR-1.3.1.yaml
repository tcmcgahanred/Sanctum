# ------------------------------------------------------------------------------
#  SIR-1.3.1 · A ministry, spokesman, or named leader states an intention, threat, warning, or red line
#
#  PIR-1: Adversary posture and activity in the AOR (What shifts in adversary
#         posture or activity have occurred in the AOR?)
#  IND-1.3: What has the adversary declared?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-1.3.1
title: 'A ministry, spokesman, or named leader states an intention, threat, warning, or red line'
status: draft
modified: '2026-10-17'
fact: 'A ministry, spokesman, or named leader states an intention, threat, warning, or red line.'
logsource:
  scope: any
  kind: any
detection:
  # BOTH HALVES IN THE TITLE, and that is a MEASURED decision, not a preference.
  # Measured 2026-09-27 over 1,576 articles with the shipped rule as the control:
  #
  #   both halves on the body, the rule this replaces   277 articles, 17.6%
  #   actor in the title, declaration anywhere          131
  #   declaration in the title, actor anywhere           28
  #   BOTH IN THE TITLE, this rule                       19
  #
  # 37 of the 277 fell inside one week and every one was read. About five were
  # the fact, and all five carried both halves in the title.
  #
  # THE FREE HALF WAS THE DECLARATION, which is the opposite of what was
  # predicted before the measurement. `declaration_terms` carries
  # `spokesperson`, `spokesman`, `defence ministry said` and `state media
  # reported`, which is ordinary furniture in the body of defence reporting, so
  # the body scope made that conjunct almost free. The adversary half is less
  # free than it looks, because it is proper nouns and 15 of this domain's 17
  # word-boundary terms are in that family.
  #
  # The nine articles separating this rule from the next-widest candidate were
  # read as well: EIGHT were false positives and ONE was the fact. A rule that
  # buys one real answer for eight wrong ones is the wider rule, not the better.
  #
  # THE SPEAKER COMES FIRST, added 2026-10-17. The adversary half now has to
  # OPEN the title, as the subject of the sentence, and is written as a pattern
  # because the rule language has no other way to say "at the start". Measured
  # over 1,911 articles in 45 days with the shipped rule as the control:
  #
  #   adversary anywhere in the title, the rule this replaces   26 articles
  #   adversary at the start of the title, this rule            20 articles
  #
  # Every match was read. Of the 12 that are not `ecns.cn`, 10 are the fact:
  # Xi's red lines (twice), "Xi warns against war", "China warns US space
  # weapons", "China urges Japan" and four Iranian warnings of retaliation.
  # The six it drops all had the adversary as the subject of someone else's
  # sentence, which is the first false-positive class below.
  #
  # THE 2026-09-27 RECALL COST IS RECOVERED. Bare `Xi` is in the pattern, so
  # "Xi warns against war in Middle East and Gulf region" now matches. It does
  # NOT touch `actor_adversary`, so no score moves, and at the start of a title
  # beside a declaration word it did not collide with the numeral or the surname
  # in this window.
  #
  # The ecns.cn finding stands, but the western count is higher than recorded:
  # 12 non-`ecns.cn` matches in 45 days, not three.
  declaration:
    group: declaration_terms
    scope: title
  # The adjectives Chinese, Russian, North Korean and Iranian are in the pattern
  # because this rule needs the adversary FIRST, which a group cannot say.
  # `actor_adversary` gained `Chinese` on 2026-10-16 and still lacks the other
  # three.
  speaker_first:
    pattern:
      match: '^(china|china''s|chinese|beijing|prc|pla|russia|russia''s|russian|moscow|kremlin|putin|lavrov|peskov|medvedev|north korea|north korean|pyongyang|kim jong un|kim yo jong|iran|iran''s|iranian|tehran|irgc|khamenei|araghchi|xi|xi jinping)\b'
      scope: title
  condition: declaration and speaker_first
falsepositives:
- THE DECLARER IS NOT THE ADVERSARY, NARROWED BUT NOT FIXED by the speaker-first pattern.
  'Report - CIA warned Europe of Russian drone attack from vessels' no longer matches. 'Russia
  is stepping up aggression towards Nato, Polish defence official warns' still does, because
  the adversary opens the title and the speaker comes at the end.
- STATE-WIRE ROUTINE STATEMENTS. 'China vows timely updates on mudslide situation' and
  'China, U.S. maintain communication on AI' (a Foreign Ministry spokesperson) are a ministry
  speaking, with no intention, threat, warning or red line. Eight of the 20 were this class,
  all ecns.cn, which is no longer collected.
- A COMPANY OR A DOMESTIC BODY RATHER THAN A MINISTRY, A SPOKESMAN OR A LEADER. 'DJI vows
  continued legal action after a US court order' is a manufacturer. 'Top anti-graft body
  vows more concrete measures' is a real state body making a real declaration, about
  corruption, which satisfies the words of this requirement and not its point.
- AN OPINION OR ANALYSIS HEADLINE BUILT ON A WARNING WORD. 'War-warning assessment in
  Australia's most dangerous times', 'The devastation of NSA Bahrain is a national security
  warning', 'Fix Defence communications with a uniformed spokesperson'. All three carry the
  declaration word in the title, so they survive the tightening.
- FIXED BY THE TITLE SCOPING, recorded so it is not reintroduced by a future widening - a
  spokesperson quoted in the body of an unrelated story ('Shahed-136 Clone Found By Florida
  Fisherman, Eglin AFB Admits It Lost'), and state-wire copy carrying no statement of intent
  ('China's BDS installed on over 12 million commercial vehicles', 'Satellite-based farming
  demo cuts inputs, boosts rice yields', 'China-Central Asia meteorological cooperation forum
  opens in Urumqi').
note: 'Scoring: any tier × declared intent. WESTERN-ONLY, 2026-09-27: this rule asked for the adversary vantage and now accepts any. Measured before the change - the adversary vantage matched 1 of the 7 declared sensors, china-arms.com, which returned 21 articles in 41 days. The owner decided not to pursue adversary primary sources, so this fact is collected from western reporting of adversary statements and activity instead. MEASURED AND TIGHTENED 2026-09-27: 277 articles of 1,576 down to 19, both halves now read in the title, with the reading and the false positives written into the detection block below. SPEAKER-FIRST 2026-10-17: 26 articles of 1,911 down to 20, the adversary now has to open the title; 12 are not ecns.cn and 10 of those are the fact.'
