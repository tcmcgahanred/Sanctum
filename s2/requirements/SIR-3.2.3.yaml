  # All 12 were read and NONE was the fact. They were programme and trade-show
  # articles about launched effects and loyal wingmen that mention a war
  # elsewhere in the body. Manned-unmanned teaming is a named concept with a
  # settled vocabulary, and it is only a finding for this domain when it
