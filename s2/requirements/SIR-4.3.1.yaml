id: SIR-4.3.1
title: 'Export, transfer, or licensed production of a counter-air system to a state in or'
status: draft
modified: '2026-09-27'
fact: 'Export, transfer, or licensed production of a counter-air system to a state in or adjacent to the AOR.'
logsource:
  scope: any
  kind: any
sensor:
  name: 'Sensor: trade press — PARTIAL'
  status: 'PARTIAL'
detection:
  # EXPORT plus a place, and the place has to be in or near the area of
  # responsibility or the transfer is somebody else's problem. Three conjuncts.
  system:
    any:
    - {group: threat_manpads, scope: blob}
    - {group: threat_sam, scope: blob}
    - {group: threat_aaa_cuas, scope: blob}
    - {group: threat_ew, scope: blob}
    - {group: threat_small_arms, scope: blob}
    - {group: threat_uas_loitering, scope: blob}
    - {group: threat_sa_designations, scope: blob}
    - {group: threat_manpads_generic, scope: blob}
    - {group: threat_sam_generic, scope: blob}
    - {group: threat_aaa_cuas_generic, scope: blob}
    - {group: threat_ew_generic, scope: blob}
    - {group: threat_small_arms_generic, scope: blob}
    - {group: threat_uas_loitering_generic, scope: blob}
  transfer:
    keywords: [export, exports, exported, export deal, arms sale, arms deal,
               arms transfer, transferred to, deliveries to, licensed
               production, co-production, coproduction, procurement contract,
               signed a contract, signed a deal, foreign military sale,
               offset agreement]
    scope: blob
  aor:
    group: geo_indopacom
    scope: blob
  condition: system and transfer and aor
note: 'Converted from EEI-4.3.a. Scoring: Tier 2, Tier 1 if the recipient is in the AOR DETECTOR ADDED 2026-09-27 AND UNMEASURED: it has not met the corpus, so it is a proposal, not a finding. Read what it matches before trusting the coverage number, and write the false positives from that reading rather than from argument.'
