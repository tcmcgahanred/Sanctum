# ------------------------------------------------------------------------------
#  SIR-4.3.1 · Export, transfer, or licensed production of an adversary counter-air system to a state in or adjacent to the AOR
#
#  PIR-4: Adversary capabilities that specifically threaten rotary-wing
#         operations (What can the adversary field that would kill or degrade
#         our helicopters?)
#  IND-4.3: Where are these systems proliferating?
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-4.3.1
title: 'Export, transfer, or licensed production of an adversary counter-air system to a state in or adjacent to the AOR'
status: draft
modified: '2026-10-20'
fact: 'Export, transfer, or licensed production of an adversary counter-air system to a state in or adjacent to the AOR.'
logsource:
  scope: any
  kind: any
detection:
  # THE SYSTEM, THE TRANSFER, THE PLACE AND THE ADVERSARY ARE READ IN THE
  # TITLE. Measured 2026-10-17 over 1,911 articles in 45 days, with the shipped
  # rule as the control:
  #
  #   all conjuncts in the body, the rule this replaces          77
  #   the same in the title                                       3
  #   the same with an adversary required                         2
  #   and with `colors` and `colours` removed, this rule          1
  #
  # All were read. The one this rule keeps is China's HQ-17 deal with Algeria.
  # `colours` was dropped after reading 'China's LD76 76mm Gun Appears in PLA
  # Colours', which is the PLA adopting its own gun, not a transfer.
  system:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - {group: threat_manpads_generic, scope: title}
    - {group: threat_sam_generic, scope: title}
    - {group: threat_aaa_cuas_generic, scope: title}
    - {group: threat_ew_generic, scope: title}
    - {group: threat_uas_loitering_generic, scope: title}
    - keywords: [air defense, air defence, air-defense, air-defence,
                 anti-aircraft, antiaircraft, SAM, interceptor, anti-drone,
                 counter-drone]
      scope: title
  transfer:
    keywords: [export, exports, exported, sale, sales, sells, sold, buys,
               bought, acquire, acquires, acquired, orders, ordered, deal,
               transfer, transfers, delivers, delivered, licensed production,
               co-production, procure, procures, procurement, purchase,
               purchases]
    scope: title
  aor:
    group: geo_indopacom
    scope: title
  # THE ADVERSARY, decided 2026-10-20: PIR-4 asks what the ADVERSARY can field.
  # Either a named adversary designation in the title (HQ-9, Pantsir and the like
  # are in the designation groups) or an adversary as the first word of the
  # title, written as a pattern because the rule language has no other way to
  # say "at the start".
  adversary:
    any:
    - {group: threat_manpads, scope: title}
    - {group: threat_sam, scope: title}
    - {group: threat_aaa_cuas, scope: title}
    - {group: threat_ew, scope: title}
    - {group: threat_uas_loitering, scope: title}
    - {group: threat_sa_designations, scope: title}
    - pattern:
        match: '^(china|china''s|chinese|beijing|prc|pla|russia|russia''s|russian|moscow|kremlin|north korea|north korea''s|north korean|pyongyang|dprk|iran|iran''s|iranian|tehran|irgc)\b'
        scope: title
  condition: system and transfer and aor and adversary
falsepositives:
- THE EXPORTER SATISFIES THE PLACE. `geo_indopacom` holds China, so a Chinese export to
  anywhere passes the place conjunct. The one match, a deal with Algeria, is outside the
  AOR. Requiring the RECIPIENT to be in the AOR needs word order the rule language does
  not express.
- THE SOURCE NAME IS PART OF THE TITLE. Google News headlines end in ' - Source Name', and
  a place or country in the source name satisfies a title conjunct. The rule language
  cannot exclude the suffix. 'US approves potential US$2.7 billion sale of Ukraine air
  defence equipment - South China Morning Post' passed the place conjunct on the
  newspaper's name; the adversary requirement removes it.
note: 'Scoring: Tier 2, Tier 1 if the recipient is in the AOR. MEASURED AND TIGHTENED 2026-10-17: 77 articles of 1,911 down to 1, every match read. ADVERSARY REQUIRED 2026-10-20 by owner decision, and the title and fact now say so.'
