# # S2 — Planning & Direction
#
# *Sanctum · `s2` · the only file the engine reads.*
#
# **BLUF:** This declares what the S2 domain cares about. Nothing here describes
# engine behaviour. The requirements tree lives in `requirements/`; the
# reasoning behind the word lists is the `vocab:` block below; **every number, term and
# threshold lives here and nowhere else.**
#
# **Reader.** The S2 section of an Army combat aviation brigade. Awareness, not
# decision support — success is *"they were not surprised,"* not *"they acted."*
# The section works strategic-to-operational; battalions handle
# operational-to-tactical, so tactical detail is lower value here. Platforms of
# interest are utility, cargo, and attack rotary wing plus organic unmanned.
#
# **Schema questions resolved 2026-08-18** against `core/rules.py` by test, not by
# reading. Proximity, nesting, and multiplier conjunctions are all supported;
# tiers cannot double-count and multipliers can. Every rule below reflects those
# answers.
#
# **The first runs test the sensors, not the scoring model.** `requirements/_tree.yaml`
# finds one of 43 collectable facts confidently covered and fifteen with none.
# With collection that thin, `force_surface` will rarely fire and 948 terms cannot
# rank an article the sensors never fetched. A quiet surface is a collection
# finding, not a scoring defect.
#
# ---
#
# ## Manifest
#
manifest:
  domain: s2
  base_dir: /opt/ravenor-s2            # Linux path — collection runs on the
                                       # collector host, not the authoring
                                       # workstation. Differs from CTI's
                                       # /opt/ravenor: shared base_dir means
                                       # shared seen-lists and one domain
                                       # silently starves the other.
                                       # NOTE: SANCTUM_BASE, if set on the host,
                                       # OVERRIDES this. Confirm it is unset or
                                       # both domains land in one directory and
                                       # this config is silently ignored.
  corpus:
    backend: rclone
    rclone_remote: gdrive:ravenor-s2-corpus
  staging:
    backend: rclone
    rclone_remote: gdrive:ravenor-s2-staging
    filename: "S2_{date}_STAGING.md"
  collection:
    # SEVEN, matching cti, decided 2026-09-27. The old value was 35 because the
    # pull was monthly and irregular; the cycle is now weekly with the staging
    # document read on Wednesday morning, so a 35-day window would re-present
    # the same items every week. Measured before the change: 33 articles a day
    # in steady state, so a 7-day window holds roughly 230 and yields about
    # seven candidates at the current 3.0 percent surface rate.
    window_days: 7
    # NO max_publish_age_days, DELIBERATELY. It is the only setting in this
    # apparatus that DELETES rather than flags, and cti's value of 7 would be
    # wrong here. Measured 2026-09-27 with tools/lag_check.py: 15 of 18
    # surfacing items arrive within 6.3 days, but three single items arrive at
    # 53.8, 151.3 and 194.3 days from china-arms.com, verticalmag.com and
    # chinapower.csis.org — 17 percent of what surfaces. lag_check warns that a
    # large p95 is often a feed dating items by INCIDENT rather than
    # publication, which then gets deleted for the wrong reason. Those three
    # need reading by hand before any cutoff is set.
    min_title_len: 15
    suffix_separators: [" - ", " | ", " — "]
    # DECLARED 2026-09-27, matching cti. Every value below is already the
    # engine's own default, checked against core/fetch.py, so this block changes
    # no behaviour today. It is here because a domain declares how it wants to
    # be treated and nobody should have to open core/fetch.py to learn what a
    # run will do.
    #
    # impersonate MATTERS MORE HERE THAN IN CTI. Several defence publishers in
    # the sensor list below serve browsers normally and return 403 to datacentre
    # addresses, which is why those comments say to verify every URL from the
    # collector host and never from a browser. `chrome` makes the fetch present
    # a real browser TLS fingerprint, which was the only thing measured to
    # recover darkreading.com for cti on 2026-08-25. A user-agent string alone
    # did not.
    #
    # decode_google_news stays true and costs nothing, because this domain
    # declares no Google News query sensor and the path is never taken. It is
    # declared rather than dropped so that adding one query feed later is a
    # one-line change in one place.
    fetch:
      user_agent: ''           # empty leaves trafilatura's own default alone
      timeout: 20              # seconds per request
      sleep_time: 1.0          # seconds between requests to one host
      max_redirects: 5
      min_extracted_size: 80   # characters. A short regional assessment is a
                               # real article; the word floor in
                               # production.staging_annotations makes the
                               # editorial call, not the extractor.
      impersonate: chrome
      decode_google_news: true
      gnews_interval: 1
#
# ---
#
# ## Sensors — collection feed list
#
# **Every URL below is UNVERIFIED against the collector host's egress.** Verify
# before the first run; several defence publishers return 403 to datacentre
# addresses while serving browsers normally.
#
# **Coverage warning.** `requirements/_tree.yaml` Byproduct 2 finds that of 43 collectable
# facts in this domain, one has confident coverage and fifteen have none. This
# sensor set does not answer PIR-2 at all. **Sources are this domain's real
# constraint — vocabulary cannot compensate, because the collector never reads the
# word groups.**
#
  # One RECORD per sensor. Every one now
  # declares a logsource, so a requirement can name the vantage it
  # needs. Scope answers whose vantage this is; kind answers what
  # type of source. Approved 2026-09-27.
  sensors:
  # Verified reachable and confirmed to return XML from the collector host,
  # 2026-08-19. Re-verify from the HOST, never a browser: several defence
  # publishers serve browsers normally and return 403 to datacentre addresses.
  # --- trade press ---
  - url: https://www.defensenews.com/arc/outboundfeeds/rss/
    group: 'Trade press'
    logsource: {scope: allied, kind: defence_press}
  # --- imagery-derived / first-look at hardware ---
  - url: https://www.twz.com/feed
    group: 'Imagery-derived / first look at hardware'
    logsource: {scope: allied, kind: defence_press}
  # --- adversary primary source ---
  # DROPPED 2026-09-27, on measurement: https://www.ecns.cn/rss/rss.xml
  #   932 of 1,576 articles in 41 days, 59 percent of
  #   the corpus, and ONE cleared the threshold - a
  #   Japanese cabinet reshuffle. Of its 15 highest
  #   scoring items, three were on subject. It is a
  #   general news agency, not a military organ, and
  #   no section feed exists: /rss/military.xml and
  #   five other paths return 404. The UNDER REVIEW
  #   note above called this in August; the numbers
  #   now say it.
  # --- adversary systems and air-domain specialist ---
  - url: https://chinese-military-aviation.blogspot.com/feeds/posts/default?alt=rss
    group: 'Adversary systems and air-domain specialist'
    logsource: {scope: allied, kind: blog}
  - url: https://www.china-arms.com/feed/
    group: 'Adversary systems and air-domain specialist'
    logsource: {scope: adversary, kind: industry}
  # --- regional strategic analysis ---
  # ASPI posts several times a week on Indo-Pacific security specifically.
  # Nothing else in this list gives regional strategic assessment.
  - url: https://www.aspistrategist.org.au/feed/
    group: 'Regional strategic analysis'
    logsource: {scope: allied, kind: think_tank}
  # --- China analysis ---
  # Lower volume than ASPI. Chokepoint and maritime coverage should finally give
  # the chokepoint multiplier something to act on.
  - url: https://chinapower.csis.org/feed/
    group: 'China analysis'
    logsource: {scope: allied, kind: think_tank}
  # --- rotary-wing professional press ---
  # Skews civil (HEMS, SAR, offshore). Added to address zero Tier 3 hits across
  # two cycles - not one article in 27 contained a rotary-wing term. Watch
  # whether it is additive or merely loud.
  - url: https://verticalmag.com/feed/
    group: 'Rotary-wing professional press'
    logsource: {scope: allied, kind: trade_press}
  # --- THEATRE QUERIES, added 2026-09-27 ---
  # WHY THESE EXIST, and it is not only collection volume:
  # tools/sensor_candidates.py nominates a publisher ONLY when every article it
  # contributed arrived through a query sensor, on the logic that a publisher a
  # query keeps dragging in is one worth reading directly. This domain had seven
  # hand-picked direct feeds and NO query sensor, so `--domain s2` correctly
  # reported zero candidates: every article it collected already came from a
  # publisher it reads directly. These queries are what give the finder
  # something to find, and they widen collection at the same time.
  #
  # EVERY STRING IS BUILT FROM THIS DOMAIN'S OWN DECLARED WORD LISTS - the
  # surface-to-air missile designations from threat_sam, the man-portable ones
  # from threat_manpads, the airframes from platform_rotary_wing, the places
  # from geo_indopacom - so a query cannot drift away from what the requirements
  # ask for.
  #
  # MEASURED FROM THE COLLECTOR HOST, 2026-09-27, over a 14-day window, before
  # any of them was declared. items / distinct publishers / publishers this
  # domain does not already read:
  #
  #   q1 surface-to-air designations      9 / 7 / 7
  #   q2 man-portable air defence        33 / 29 / 29
  #   q3 rotary-wing losses              44 / 40 / 39
  #   q4 loitering munitions              3 / 3 / 3
  #   q5 PLA aviation                    55 / 43 / 43
  #   q6 counter-unmanned in theatre     31 / 28 / 28
  #   q7 airfield construction           21 / 20 / 20
  #
  # 196 items and 150 distinct new publishers, which is close to one publisher
  # per item: a Google News query is DIFFUSE by design, and that is exactly the
  # signal the finder reads. Among the recurring ones: scmp.com, defence-blog.com,
  # militarywatchmagazine.com, quwa.org, 19fortyfive.com, taiwannews.com.tw,
  # aerospaceglobalnews.com, globaltimes.cn. Among the ones that show it also
  # drags in noise: nypost.com, aol.com, facebook.com, dailywire.com.
  #
  # ALL SEVEN ARE DECLARED RATHER THAN THE BEST THREE, on this domain's own
  # standing directive to prefer a false positive to a miss. THE PRUNE IS A
  # MEASUREMENT, NOT A GUESS: after a week of collection, run
  # `tools/sensor_candidates.py --domain s2 --days 7` and
  # `tools/sensor_health.py --domain s2 --days 7`, and drop the queries that
  # bought no publisher and no surfacing item. q4 at three items is the first
  # candidate for that.
  #
  # `scope: mixed` IS A NEW VALUE AND IT IS DELIBERATE. An aggregator returns
  # whatever Google matched, from allied trade press to adversary state media in
  # the same feed, so claiming either vantage would be false. All 43
  # requirements currently declare `scope: any` and `kind: any`, so nothing
  # starves; a future requirement that genuinely needs the allied vantage
  # correctly will not be satisfied by these.
  #
  # `kind: query` IS ALSO NEW HERE, and the finder keys on exactly that value.
  #
  # NOTE FOR WHOEVER READS core/rules.py NEXT: `logsource_match` says in its
  # docstring that `any` on EITHER side matches anything, but the code strips
  # `any` only from the RULE side and compares the sensor side by equality. A
  # sensor declaring `scope: any` would therefore NOT satisfy a rule requiring
  # `scope: allied`. That is why these records name a real value instead.
  #
  # `manifest.collection.fetch` already declares `decode_google_news: true`,
  # which was noted as costing nothing because no query sensor existed. It is
  # load-bearing from today: every item below arrives as a Google News wrapper
  # and is resolved one at a time at a one-second interval.
  - url: https://news.google.com/rss/search?q=%28%22HQ-9%22%20OR%20%22HQ-16%22%20OR%20%22HQ-17%22%20OR%20%22HQ-19%22%29%20%28missile%20OR%20%22air%20defense%22%20OR%20%22air%20defence%22%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: surface-to-air designations'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28MANPADS%20OR%20%22shoulder-fired%22%20OR%20%22QW-2%22%20OR%20%22FN-6%22%29%20%28helicopter%20OR%20aircraft%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: man-portable air defence'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28helicopter%20OR%20Mi-8%20OR%20Mi-24%20OR%20Ka-52%29%20%28%22shot%20down%22%20OR%20downed%20OR%20%22combat%20loss%22%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: rotary-wing losses'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28%22loitering%20munition%22%20OR%20%22FPV%20drone%22%29%20%28helicopter%20OR%20airfield%20OR%20%22parked%20aircraft%22%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: loitering munitions against aircraft'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28PLA%20OR%20Chinese%29%20%28%22army%20aviation%22%20OR%20helicopter%20OR%20%22Z-20%22%20OR%20%22Z-10%22%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: adversary army aviation'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28%22counter-UAS%22%20OR%20%22counter-drone%22%29%20%28China%20OR%20Taiwan%20OR%20Japan%20OR%20Philippines%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: counter-unmanned in the theatre'
    logsource: {scope: mixed, kind: query}
  - url: https://news.google.com/rss/search?q=%28airfield%20OR%20runway%20OR%20%22hardened%20shelter%22%29%20%28China%20OR%20Taiwan%20OR%20Philippines%20OR%20Guam%29%20%28construction%20OR%20expansion%20OR%20hardening%29%20when%3A14d&hl=en-US&gl=US&ceid=US:en
    group: 'Theatre queries: airfield construction and hardening'
    logsource: {scope: mixed, kind: query}
  # --- REJECTED, do not re-add without re-testing ---
  # blog.usni.org/feed - 301s to www.usni.org/feed, which returns 403 behind bot
  # protection. Serves browsers, blocks the collector. Removed 2026-08-19.
  # english.chinamil.com.cn/rss.xml - PLA Daily. TLS certificate does not match
  # the hostname; http and eng. variants return 404 meta-refresh pages. The
  # endpoint appears to be gone. THIS WAS THE INTENDED SOURCE FOR THE
  # DECLARED-INTENT SIGNAL, which remains without a proper feed. NOT BEING
  # REPLACED - see WESTERN ONLY below.
  # china.org.cn/rss/1201719.xml - returns HTML, not a feed.
  # ainonline.com/rss.xml - 404.
  # rotorhub.com/feed - real feed, but overlaps verticalmag heavily and is
  # explicitly civil and parapublic. Held under 6.1: cannot say what it gives
  # that verticalmag does not.
  # understandingwar.org - ISW. /feed and /feed without www both return HTML,
  # /rss.xml returns 403. Content is a good fit; no usable feed found 2026-08-19.
  # iiss.org/rss/ - 403.
  # csis.org/analysis/feed - 404. The chinapower subdomain feed works.
  # rand.org/topics/china.xml - returns the channel title and no items. Empty or
  # unparseable. Not worth debugging.
  # --- UNDER REVIEW ---
  # ecns.cn is GONE, dropped above on measurement 2026-09-27. The paragraph that
  # used to sit here kept it only because it was the last adversary primary
  # source. That reason is void; see WESTERN ONLY below.
  # chinese-military-aviation.blogspot.com returned ONE article in 41 days,
  # measured 2026-09-27, so the first cycle's zero was not a one-off. Prune
  # candidate, with the caveat that a specialist blog can be low volume and high
  # value. Read the one article before deciding.
  # --- WESTERN ONLY, decided by the owner 2026-09-27 ---
  # ADVERSARY PRIMARY SOURCES ARE NOT BEING PURSUED. A replacement for PLA Daily
  # is off this list, and no requirement asks for the adversary vantage any
  # more: the six that did were widened to accept any source on the same day,
  # and each carries the measurement in its own note - that vantage matched 1 of
  # the 7 declared sensors. Declared intent, doctrine and mobilisation are
  # collected from western reporting OF them instead, which is what the trade
  # press and the two think tanks in this list already do.
  # china-arms.com STAYS, and keeps its adversary label, which is a fact about
  # the sensor and not a goal: 21 articles in 41 days, one surfaced.
  # --- STILL MISSING, see requirements/_tree.yaml Byproduct 1 ---
  # 1. A military rotary-wing professional source. Vertical is civil-leaning and
  # the military-specific publications are subscription-only.
  # 2. Conflict OSINT loss documentation. The accounts that systematically record
  # rotary-wing losses publish on social platforms with no feed. This EEI may
  # need a mechanism other than a sensor.
  # 3. Host-nation and regional press within the AOR.
#
# ---
#
# ## Scoring
#
# An item takes the weight of the **highest tier it qualifies for** — tiers are
# not additive. Multipliers stack multiplicatively on top. Absent multipliers are
# neutral, never a penalty.
#
# **Design intent, tiers.** Tier rank encodes how *directly* an item hits, not how
# much the reader cares. A high-ranked requirement legitimately sits in a low tier
# — PIR-2 is ranked second and lives in Tier 3 because environmental conditions
# are genuinely less direct than an adversary act. That is not an error; do not
# "fix" it.
#
# **Design intent, Tier 2.** Deliberately platform-anchored rather than
# theatre-anchored: the aviation mission is constant, the theatre is an
# assignment. A system that kills someone else's helicopters today is a system
# that kills ours later. Geography stops mattering below Tier 1.
#
scoring:
  tiers:
    # PROXIMITY CONFIRMED AVAILABLE. Two deliberate choices below.
    #
    # a-side is event_words, NOT actor_adversary. The a-side term is located by
    # raw substring search with no word-boundary protection; the b-side uses the
    # boundary matcher. actor_adversary contains "PLAN", which raw-matches inside
    # "planning" and would anchor the window on the wrong text. Event verbs are
    # longer and mostly not embeddable, so they are the safer anchor.
    #
    # Only the FIRST occurrence of each a-side term is tested. That is a
    # per-term limit, not per-group: with a large event vocabulary the rule gets
    # many anchor points, which materially reduces the risk. It does not
    # eliminate it — an adversary named early in passing and again beside an
    # event word later will still be missed.
    #
    # Proximity never searches the title, so the second branch covers the case
    # where both terms appear in a headline. Titles are short, so co-occurrence
    # there is inherently proximate.
    # CYCLE 4 FINDING — actor group corrected 2026-08-19.
    # Tier 1 returned ZERO across four cycles and ~300 articles. Cause: the
    # actor group held institutional names only (PLA, PLAN, China Coast Guard),
    # because bare demonyms had been excluded as too noisy. State names were in
    # the geography group instead. So an analytical piece on "China's increased
    # military activities in the Indo-Pacific" — which answers the top-ranked
    # requirement completely — matched geography twice and no actor at all, and
    # scored as a catch-all item.
    #
    # State names added to the actor group. An INDOPACOM state name now
    # satisfies both the actor and the geography condition from one word, which
    # is intended: naming the state establishes both. Non-AOR adversaries
    # (Russia, Iran) still require separate INDOPACOM geography, which is also
    # intended.
    #
    # WATCH: this could over-fire. "China" plus any event verb in proximity now
    # reaches 8.0. Accepted deliberately — four cycles of zero is measured, the
    # risk of over-firing is speculative, and under a "not surprised" standard a
    # miss costs more than a false positive. Reassess after two cycles.
    #
    # Tier 1 is deliberately PLATFORM-AGNOSTIC. It asks whether the adversary is
    # moving in our theatre, which matters whether or not aircraft are named.
    # The rotary-wing lens lives in Tier 3 and in force_surface, where it
    # discriminates. Putting it here too is what made the top requirement
    # unreachable by the top tier.
    # THE REASSESSMENT THE WATCH NOTE ABOVE ASKED FOR, done 2026-09-27 with
    # numbers instead of a guess. It over-fired, exactly as suspected, and the
    # proximity branch is now DELETED. The title branch is the whole tier.
    #
    # WHY IT COULD NOT BE SEEN UNTIL NOW. Term matching was case-sensitive until
    # 2026-09-27, and 144 of this domain's 149 geography terms and 51 of its 52
    # adversary terms are capitalised, so the branch that over-fires was nearly
    # unsatisfiable when the watch note was written. The four cycles of zero it
    # records had two causes, not one.
    #
    # MEASURED over the 7 days to 2026-09-27, 250 articles of which 169 are the
    # dropped ecns.cn sensor and 81 are the western sensors that remain:
    #
    #                                     surfaced  surfaced  western tier
    #                                     of 250    of 81     T1  T2 T3 T4
    #   both branches, as it stood           108      32       20  10  0 51
    #   TITLE BRANCH ONLY, this rule          95      27        9  14  0 58
    #   title branch or event-near-actor
    #     inside the title                    96      27        9  14  0 58
    #   either branch plus a rotary-wing
    #     or threat-vocabulary conjunct       24      20        5  10  0 66
    #
    # The third variant differs from this one by ONE article in 250, so its
    # extra branch buys nothing. THE FOURTH IS REJECTED, and the comment above
    # already said why: a platform conjunct here is what made the top
    # requirement unreachable by the top tier. Measured, it also drops "North
    # Korea Tests New Hwasong-11Ma Hypersonic Missile", "China's Recent J-36
    # Heavy Stealth Tactical Jet Testing" and "China Appears To Be Building A
    # Mothership For Large Uncrewed vessels" while KEEPING "China claims 2 golds
    # at World Climbing" at tier 1. It also stopped three of the four articles
    # answering SIR-1.3.1 from surfacing at all.
    #
    # WHAT THIS TIER NOW ACTUALLY SAYS, in one line: an adversary STATE NAME in
    # the headline. The two conjuncts collapse to one word, because the comment
    # above records that a state name deliberately satisfies both the actor and
    # the geography condition. That is why "China claims 2 golds at World
    # Climbing Championships" still reaches 8.0, and it is the honest reading of
    # the rule rather than a defect in the wiring.
    #
    # THE NINE THE TITLE BRANCH LEAVES AT TIER 1 WERE READ. Four are the fact -
    # the Hwasong test, the J-36 testing, the uncrewed mothership, and the F-35
    # canopy and weapons-bay door loss to China. Five are analysis or allied
    # policy that merely carries an adversary and a place in one headline, and
    # the next lever on those is an event word required in the title as well.
    # That is NOT being changed today, because the 7-day window is two-thirds a
    # sensor no longer collected: re-measure on 2026-10-07, when the window is
    # western-only for the first time.
    #
    # THE FIVE IT STOPS SURFACING WERE READ TOO. Three are opinion pieces. Two
    # are arguable - a first uncrewed-submarine torpedo firing, and the US
    # watching Chinese marine presence off Alaska - and both remain in the drop
    # list where the analyst reads them.
    #
    # A BONUS, and it retires half of a known defect: this deletes one of the
    # two live users of the event_words-to-actor_adversary proximity, whose
    # a-side has no word-boundary protection at any length.
    #
    # STILL TRUE AND STILL DELIBERATE: this tier is PLATFORM-AGNOSTIC. Its NAME
    # says "affecting rotary wing" and its condition does not, which is the
    # design recorded above rather than an oversight - but the name is therefore
    # misleading and belongs on the wording review.
    - id: 1
      name: "adversary activity or capability change inside INDOPACOM affecting rotary wing"
      weight: 8.0
      require:
        all:
          - {group: actor_adversary, scope: title}
          - {group: geo_indopacom, scope: title}

    # CYCLE 1 FINDING — REWRITTEN 2026-08-19.
    # The previous rule was a bare any: across the threat groups, with no
    # adversary requirement at all. The word "adversary" was in the tier's name
    # and nowhere in its rule. Result: a US counter-drone cannon, a DARPA
    # missile designed to EVADE air defences, and US missile production
    # contracts all scored as adversary capability. Ten of ten surfaced items
    # in cycle 1 were US or allied stories.
    #
    # Cause: the threat groups mixed two kinds of term. Designations like the
    # HQ, S-, Igla and SA- series self-identify as adversary systems. Generic
    # capability terms — "air defense system", "counter-UAS", "surface-to-air
    # missile" — describe anyone's kit, including ours.
    #
    # Fix: designations qualify alone; generic capability terms must appear
    # alongside an adversary actor.
    - id: 2
      name: "adversary capability threatening rotary wing, anywhere"
      weight: 4.0
      require:
        any:
          # branch A — named adversary systems, self-identifying
          - any:
              - {group: threat_manpads, scope: blob}
              - {group: threat_sam, scope: blob}
              - {group: threat_aaa_cuas, scope: blob}
              - {group: threat_ew, scope: blob}
              - {group: threat_small_arms, scope: blob}
              - {group: threat_uas_loitering, scope: blob}
              - {group: threat_sa_designations, scope: blob}
          # branch B — capability class, adversary attribution required
          - all:
              - any:
                  - {group: threat_manpads_generic, scope: blob}
                  - {group: threat_sam_generic, scope: blob}
                  - {group: threat_aaa_cuas_generic, scope: blob}
                  - {group: threat_ew_generic, scope: blob}
                  - {group: threat_small_arms_generic, scope: blob}
                  - {group: threat_uas_loitering_generic, scope: blob}
              - {group: actor_adversary, scope: blob}

    # NESTING CONFIRMED: any and all recurse through the same evaluator, so two
    # alternate conjunction branches belong in ONE tier. Do not split this into
    # two tiers of equal weight — tier assignment stops at the first match, so
    # the second would be unreachable for anything the first already caught, and
    # the reasoning line would name only one branch.
    # CYCLE 3 FINDING — REWRITTEN 2026-08-19.
    # The previous rule required conflict_markers AND platform_rotary_wing
    # anywhere in the body, with no proximity. Bare "helicopter" plus one
    # generic conflict word is satisfied by almost any long-form defence
    # article. Observed false positives: a carrier's island superstructure
    # ('ongoing conflict' + 'helicopter'), a Polish frigate ('countermeasure' +
    # 'helicopter'), and homeland drone defence ('shot down' + 'helicopter').
    # None is a rotary-wing lesson.
    #
    # Fix: proximity, same mechanism as Tier 1. A helicopter named in paragraph
    # two and "destroyed" in paragraph nine is not a rotary-wing loss.
    #
    # a-side is the conflict and environment groups, NOT platform. The a-side
    # gets raw substring search with no word-boundary protection; platform
    # contains short designations that would anchor windows wrongly.
    #
    # Third branch covers titles, which proximity never searches. Titles are
    # short, so co-occurrence there is inherently proximate.
    - id: 3
      name: "rotary-wing lessons from active conflict, or AOR conditions degrading rotary-wing operations"
      weight: 2.0
      require:
        any:
          # active-conflict branch
          - proximity: {a: conflict_markers, b: platform_rotary_wing, window: 120}
          # active-conflict branch, title scope
          - all:
              - {group: conflict_markers, scope: title}
              - {group: platform_rotary_wing, scope: title}
          # AOR environmental branch
          - all:
              - proximity: {a: env_basing, b: platform_rotary_wing, window: 120}
              - {group: geo_indopacom, scope: blob}

    - id: 4
      name: "in scope, no stronger anchor"
      weight: 1.0
      require: always

  multipliers:
    # FACTORS REDUCED AND ONE SIGNAL DROPPED — 2026-08-19, cycle 3.
    #
    # The stack was six signals at 1.5/1.3, which multiplies to 6.43x, not the
    # ~4.9x recorded in earlier comments. That figure was an arithmetic error
    # carried since Part 4. 6.43x exceeds two tier steps, so relevance had
    # stopped ordering the queue: an observed catch-all item with five signals
    # scored 6.43 and outranked every Tier 2 and Tier 3 item in the cycle.
    #
    # The chokepoint signal is dropped outright. It fired on five of ten
    # candidates. A signal that fires on most items carries no information, and
    # in an INDOPACOM domain strait names are background, not signal. The names
    # remain in the geography group, where they do real work — no coverage is
    # lost. This also resolves the cross-group duplication recorded in the vocab: block.
    #
    # Remaining five at 1.4 / 1.2 multiply to 3.39x — under two tier steps, so
    # a fully-lit catch-all item can no longer beat a bare Tier 2.

    - name: "adversary declares intent, threat or warning"
      factor: 1.4
      when:
        all:
          - {group: declaration_terms, scope: blob}
          - {group: actor_adversary, scope: blob}

    - name: "escalation indicators"
      factor: 1.4
      when: {group: escalation_terms, scope: blob}

    # WATCH: fired on four of ten candidates in cycle 3. If it stays that high
    # it needs pairing with actor_adversary, the same fix applied to declared
    # intent. Not changed yet - one cycle is not enough evidence.

    - name: "coercive or hostile act against US forces, allies or partners"
      factor: 1.2
      when: {group: coercive_acts, scope: blob}

    - name: "first occurrence or fielding"
      factor: 1.2
      when: {group: first_occurrence, scope: blob}

    - name: "fixed-date event window"
      factor: 1.2
      when: {group: fixed_date_events, scope: blob}

  # Inclusion, never ranking. Deliberately narrow: a threat system that actually
  # engaged something is the one case where a low score would be wrong no matter
  # what else the item lacks. Both halves are required — a threat system alone
  # is ordinary Tier 2 material.
  #
  # Highest-cost position in the config for a noisy term: the score cannot
  # correct a bad match here. Nothing enters these groups without a collision
  # audit in the vocab: block below.
  force_surface:
    - name: "threat system engaged an aircraft"
      when:
        all:
          - any:
              # designations
              - {group: threat_manpads, scope: blob}
              - {group: threat_sam, scope: blob}
              - {group: threat_aaa_cuas, scope: blob}
              - {group: threat_small_arms, scope: blob}
              - {group: threat_uas_loitering, scope: blob}
              # capability class — no adversary term required here, because the
              # conflict and platform conditions below already do that work. An
              # aircraft taking ground fire in an active conflict is worth
              # reading whoever was flying it.
              - {group: threat_manpads_generic, scope: blob}
              - {group: threat_sam_generic, scope: blob}
              - {group: threat_aaa_cuas_generic, scope: blob}
              - {group: threat_small_arms_generic, scope: blob}
              - {group: threat_uas_loitering_generic, scope: blob}
          - {group: conflict_markers, scope: blob}
          # WIDENED 2026-08-19 to any aircraft, not rotary wing only. A fixed-wing
          # aircraft downed by a man-portable system tells you about the system,
          # and that is worth guaranteed inclusion. Volume stays low because the
          # conflict and threat conditions above still both have to hold.
          - any:
              - {group: platform_rotary_wing, scope: blob}
              - {group: platform_fixed_wing, scope: blob}

  settings:
    # PROVISIONAL. Not measured against a real corpus. At 2.0 a bare Tier 4
    # item (1.0) does not surface, but a Tier 4 item with any two multipliers
    # does. Re-measure after three cycles. Tune weights and vocabulary, never
    # cap the count — the uncapped surface is the diagnostic.
    surface_min_score: 2.0
    empty_title: {score: 0.5, tier: 4, flag: "FLAG: empty title (feed artifact — verify source)"}
    recency:
      enabled: true
      window_days: 7           # MUST track collection.window_days above, or
                               # most of the corpus is flagged stale on every
                               # run. Flags only; never drops.
      # THE SAME CYCLE AS cti, decided 2026-09-27. Was monday, 05:00, UTC.
      # THE TIMER DOES NOT MOVE: ravenor-s2.timer stays at 05:30 Pacific while
      # ravenor.timer fires at 04:00, because a cti run takes 36 minutes and the
      # two must not compete for the network. The rule is only that the declared
      # cutoff sits at or BEFORE the hour the run starts — a 04:00 cutoff
      # against a 05:30 run is correct. Declaring a time that has not yet passed
      # walks the window back a whole WEEK, silently.
      cutoff_weekday: wednesday
      cutoff_time: "04:00"
      timezone: America/Los_Angeles
    grouping:
      enabled: true
      min_similarity: 0.55
      min_shared_tokens: 3
      min_evidence: 8.0
      max_group_size: 25
      max_group_display: 12

