# ==============================================================================
#  CTI - SANCTUM DOMAIN FILE
#
#  Everything this domain needs, in the order the intelligence cycle runs it.
#  The engines in core/ read this file. Comments are for whoever edits it.
#  
#  Dated history is NOT here - it is in CHANGELOG.yaml, keyed by the setting
#  each entry concerns. What survived the history is in README.md's tenets.
#  
#  A comment on a value says what BREAKS if you change it. Why we chose it
#  is in the changelog. If a sentence would read identically in another
#  domain's file, it belongs in core/README.md, not here.
# ==============================================================================

# ==============================================================================
#  STAGE 1 - PLANNING & DIRECTION
#
#  What we need to know, and where the machine keeps its things.
#  Changing a requirement here changes what the whole cycle is for.
# ==============================================================================

# ------------------------------------------------------------------------------
#  REQUIREMENTS - KIQ / PIR / SIR / EEI
#
#  Each scoring tier declares the PIR it answers, by identifier only.
#  Each scoring rule may declare the EEIs it can honestly attest.
#  vocab_check verifies every declared identifier exists in this tree.
# ------------------------------------------------------------------------------
#  HOW THIS TREE CONNECTS TO SCORING
#    kiq        the one question the whole effort exists to answer. Read by
#               people only; no engine touches it.
#    pirs[]     each PIR carries `tier:`, and that number must match an `id:`
#               under scoring.tiers. That is the link between what we need to
#               know and what the machine rewards.
#    sirs[]     the sub-questions that decompose a PIR.
#    eeis[]     the specific fact that answers a SIR. A scoring rule may name
#               one in `serves_eei:` to claim it can honestly attest it.
#  tools/vocab_check.py fails if a rule names a PIR or EEI that is not here.
#  Nothing else is derived: `fact`, `sensor`, `scoring`, `standard` and `note`
#  are for the analyst and for whoever builds the next sensor.
requirements:
  kiq:
    id: KIQ-1
    question: What cyber threats endanger California SLTT organizations and the critical infrastructure
      they operate or depend on?
    collection_posture: Cast a wide net. Any credible cyber-threat reporting is in scope at
      collection. Trusted sources are ingested wholesale and AOR relevance is decided at scoring,
      never by keyword pre-filtering at collection.
  pirs:
  - id: PIR-1
    tier: 1
    name: Direct impact to California organizations
    question: What incidents, breaches, or targeting have directly affected California-based
      organizations or entities?
    sirs:
    - id: SIR-1.1
      question: Which California SLTT / critical-infrastructure organizations reported a breach
        or incident this window?
      eeis:
      - id: EEI-1.1.a
        fact: Breach notifications affecting Californians (org, date, type, records).
        sensor:
          name: CA AG breach-registry scraper
          status: PENDING
        scoring: Tier-1 CA-direct
        note: 'No longer blocked by the collector. A sensor record may now declare ''kind:
          page'', which is re-read every run and identified by its contents rather than its
          URL, so a portal that posts new notifications under one unchanging address is
          collected. The scraper that turns registry rows into per-victim records is still
          to build - sensor_roadmap priority 1 - and the record should declare a ''title:''
          or the scorer will floor it as untitled.'
      - id: EEI-1.1.b
        fact: Extortion/leak-site posts naming California victims.
        sensor:
          name: ransomware leak-site aggregator, CA-filtered
          status: PENDING
        scoring: Tier-1 + ransomware/CI
      - id: EEI-1.1.c
        fact: Regional/local press reports of incidents at CA local-gov, school, utility or
          tribal entities.
        sensor:
          name: curated CA regional press
          status: PENDING
        scoring: Tier-1 CA-direct
        note: StateScoop is SLTT trade press, not CA regional press. This EEI remains unserved.
      - id: EEI-1.1.d
        fact: Official CA advisories naming an affected CA entity.
        sensor:
          name: Cal OES + CDT + MS-ISAC
          status: ACTIVE
          also: Cal-CSIC - PENDING
        scoring: Tier-1, primary source
        note: 'Cal-CSIC remains unserved: publishing, but PDF/DOCX on an HTML index with no
          RSS. The collector blocker is gone - declare the index as ''kind: page'' and it is
          re-read every run - but reaching the advisories themselves still means parsing that
          index, or the documents behind it.'
    - id: SIR-1.2
      question: Is the affected organization inside the 34-county CCIC AOR?
      eeis:
      - id: EEI-1.2.a
        fact: Org county/location matched against the 34-county list.
        sensor:
          name: derived at scoring
          status: ACTIVE
        scoring: AOR-county match - all 34 counties present in the geo group
        note: 'Known precision gap: several county names are not California-exclusive. kings
          county is Brooklyn; lake county is Illinois, Florida, Indiana and Ohio; trinity
          county is also Texas; sierra county is also New Mexico. Any of these plus an incident
          term in proximity scores Tier-1. The reasoning line makes it auditable; the analyst
          must catch it.'
      - id: EEI-1.2.b
        fact: In-AOR vs near-AOR vs out-of-AOR-but-CA classification.
        scoring: annotation - e.g. Suisun/Solano = near-AOR
    - id: SIR-1.3
      question: What is the verified operational impact, versus what is merely claimed?
      eeis:
      - id: EEI-1.3.a
        fact: Confirmed disruption (systems down, public-safety/911 impact, operational degradation),
          verified against a primary source.
        standard: Verify specific impact claims before publishing; soften or cut unverifiable
          specifics. Anti-FUD.
      - id: EEI-1.3.b
        fact: 'Attribution status: confirmed / suspected / unknown.'
        standard: Attribution discipline - never state suspected as fact.
  - id: PIR-2
    tier: 2
    name: SLTT sector targeting anywhere (leading indicator)
    question: What threat activity is targeting SLTT-relevant sectors anywhere, as a leading
      indicator for the AOR?
    sirs:
    - id: SIR-2.1
      question: Which SLTT sectors are being targeted this window (water/wastewater, K-12/higher-ed,
        local gov, tribal/territorial)?
      eeis:
      - id: EEI-2.1.a
        fact: Reported attacks/targeting of a named SLTT sector, any geography.
        sensor:
          name: national trusted feeds + StateScoop
          status: ACTIVE
          also: K-12 Dive, WaterISAC - PENDING; GovTech - REJECTED
        scoring: Tier-2 sector
        note: GovTech advertises no working feed - both candidate paths returned 0 entries
          and HTTP 404. Do not retry without new evidence.
      - id: EEI-2.1.b
        fact: Sector ISAC/agency advisories (WaterISAC, MS-ISAC, CISA sector alerts).
        sensor:
          name: MS-ISAC + CISA (4 feeds)
          status: ACTIVE
          also: WaterISAC - PENDING
        scoring: Tier-2, primary source
    - id: SIR-2.2
      question: Does the targeted sector/technology generalize to the AOR?
      eeis:
      - id: EEI-2.2.a
        fact: Whether the targeted tech/config is common in AOR SLTT orgs (e.g. internet-exposed
          PLCs in small water systems).
        scoring: low-maturity SLTT tech multiplier
        note: 'This is the leading-indicator logic: out-of-state targeting matters because
          the same exposure exists here.'
    - id: SIR-2.3
      question: Is this an isolated incident or a widening campaign?
      eeis:
      - id: EEI-2.3.a
        fact: Multiple incidents sharing TTPs/sector across geographies.
        analytic: convergence - supports a widening-campaign framing, e.g. the multistate
          water attacks
  - id: PIR-3
    tier: 3
    name: Actively-exploited vulnerabilities in SLTT-common technology
    question: What in-the-wild / KEV vulnerabilities affect technology common in low-maturity
      SLTT environments?
    sirs:
    - id: SIR-3.1
      question: What is actively exploited in the wild this window?
      eeis:
      - id: EEI-3.1.a
        fact: CISA KEV additions (CVE, date, exploitation status, ransomware-use flag).
        sensor:
          name: dedicated KEV feed
          status: ABSENT
        scoring: KEV multiplier
        note: No dedicated KEV sensor. KEV additions reach the corpus only when an advisory
          or aggregator mentions them - the single-aggregator dependence the ICD 203 review
          flagged. Cheap to close.
      - id: EEI-3.1.b
        fact: Vendor PSIRT advisories confirming in-the-wild exploitation.
        sensor:
          name: vendor PSIRTs (Cisco, Palo Alto, Fortinet)
          status: ACTIVE
        scoring: KEV/exploitation
    - id: SIR-3.2
      question: Does the affected technology exist in low-maturity SLTT environments?
      eeis:
      - id: EEI-3.2.a
        fact: Whether the product is commonly deployed by SLTT orgs (edge appliances, on-prem
          SharePoint, RMM, routers).
        scoring: low-maturity SLTT tech multiplier
      - id: EEI-3.2.b
        fact: Which providers/versions are affected, and does the audience use them?
        standard: Provider-dependent relevance - a webmail/product item is relevant only if
          it hits providers the audience runs (Google Workspace, Microsoft 365). MSP-only
          software is low-relevance if few orgs in the AOR use MSPs.
    - id: SIR-3.3
      question: What is the remediation posture?
      eeis:
      - id: EEI-3.3.a
        fact: Patch availability and KEV remediation deadline.
        standard: 'Actionability - frame as a vendor-accountability ask: ''confirm your vendor
          or IT provider patched X''.'
  - id: PIR-4
    tier: 4
    name: Broad/national threats with SLTT relevance
    question: What national-scale threats carry material relevance to SLTT defenders?
    sirs:
    - id: SIR-4.1
      question: What national-scale threats materially affect SLTT defenders?
      eeis:
      - id: EEI-4.1.a
        fact: National advisories/campaigns with an SLTT nexus.
        sensor:
          name: national feeds
          status: ACTIVE
        scoring: Tier-4
      - id: EEI-4.1.b
        fact: 'Audience-portfolio relevance: does it reach the SLTT audience, or is it developer-only,
          defense-industrial-only, or vendor opinion?'
        standard: Audience filter - developer-targeted (npm poisoning) and defense-industrial-base
          (CMMC) items are out of portfolio unless they reach SLTT through a vendor.
  # NOT READ BY ANY ENGINE. The build order for collection gaps, kept beside
  # the requirements so a gap and the thing it starves stay in one file.
  # `serves:` here points at the EEI that stays unanswered until it is built.
  sensor_roadmap:
  - priority: 0
    build: Fix process_page re-collection (core/acolyte.py)
    status: DONE 2026-09-03
    serves: []
    note: 'Kept as the record of a prerequisite, not a sensor. Page sources were deduplicated
      on URL hash, so a portal was captured once and never revisited, and priorities 1 and
      2 were both useless until it landed. A record may now declare ''kind: page'': it is
      re-read every run and identified by a hash of its normalised text. Re-collection is
      opt-in on purpose - process_feed returns nothing for a healthy feed having a bad day,
      and re-reading those would write a record every time an error page reflowed.'
  - priority: 1
    build: CA AG breach-registry scraper
    serves:
    - EEI-1.1.a
    note: 'Highest value: the only authoritative AOR-direct breach sensor. PIR-1 has almost
      no active collection without it.'
  - priority: 2
    build: Cal-CSIC advisories
    serves:
    - EEI-1.1.d
    note: Confirmed publishing. Extracting the index page may be enough, since titles and
      dates are what the scorer consumes - prove that before building PDF parsing.
  - priority: 3
    build: Ransomware leak-site aggregator, CA-filtered
    serves:
    - EEI-1.1.b
    note: 'Early-warning AOR-direct: victims appear before local press.'
  - priority: 4
    build: CISA KEV as a primary feed
    serves:
    - EEI-3.1.a
    note: Cheapest item on this list. Reduces single-aggregator dependence.
  - priority: 5
    build: Curated CA regional press
    serves:
    - EEI-1.1.c
    note: Still unserved; StateScoop does not cover it.
  - priority: 6
    build: Remaining sector trade press (K-12 Dive, WaterISAC)
    serves:
    - EEI-2.1.a
    - EEI-2.1.b

# ------------------------------------------------------------------------------
#  RUNTIME & STORAGE
#
#  base_dir is the only host-coupled value. $SANCTUM_BASE overrides it and
#  WINS over this file - set globally it overrides every domain at once.
# ------------------------------------------------------------------------------
#  Every path below is relative to base_dir unless it is absolute.
manifest:
  domain: cti
  base_dir: /opt/ravenor
  sensors_file: references/sensors.txt
  # WHERE COLLECTED ARTICLES LIVE, permanently. Nothing in Sanctum prunes the
  # corpus; scoring re-reads it, so a rule change can be re-run over history.
  #   backend: local   -> base_dir/corpus/<date>/
  #   backend: rclone  -> synced to rclone_remote, and rclone must be
  #                       configured on the collector host or collection fails.
  corpus:
    backend: rclone
    rclone_remote: gdrive:ravenor-corpus
  # EXTERNAL LISTS FETCHED AND CACHED at collection time, keyed by a pattern
  # found in the article. Available to the annotator; NOT wired into scoring —
  # nothing here changes a score today.
  #   json_path / key_field  where the identifiers sit in the downloaded JSON
  #   match_pattern          what to look for in an article to key against it
  #   cache_hours            re-download only when the cache is older than this
  reference_lists:
    kev:
      url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      json_path: vulnerabilities
      key_field: cveID
      match_pattern: CVE-[0-9]{4}-[0-9]{4,7}
      cache_hours: 12
  # WHERE THE STAGE 3a DOCUMENT IS WRITTEN. {date} is the run date. This is the
  # handoff to 3b — if the push fails the run still produces the file locally.
  staging:
    backend: rclone
    rclone_remote: gdrive:ravenor-staging
    filename: WCTI_{date}_STAGING.md

# ------------------------------------------------------------------------------
#  STAGE 2 - COLLECTION
#
#  Where to look, how hard, and how far back. Trusted sources are ingested
#  wholesale; AOR relevance is decided later at scoring, never by filtering
#  here. A feed earns its place only if it is reliable AND additive.
# ------------------------------------------------------------------------------
  # THE TWO WINDOWS ARE NOT THE SAME WINDOW, and only one of them drops
  # anything. Confusing them is the most expensive mistake available here:
  #   window_days           how far back to GATHER from the corpus, by
  #                         COLLECTION date. Outside it, an item is absent.
  #   max_publish_age_days  refuses an item at collection when its PUBLISH date
  #                         is older than this. The only place Sanctum deletes
  #                         rather than flags. Reversible — a refused item is
  #                         not recorded as seen, so lifting this re-admits it.
  #   scoring.settings.recency is the third and mildest: it only FLAGS.
  collection:
    window_days: 7
    max_publish_age_days: 7
    # Titles shorter than this are treated as feed artifacts, not articles.
    min_title_len: 15
    # Publisher suffixes stripped from titles before deduplication, so
    # "Story - The Record" and "Story | The Record" count as one item.
    suffix_separators:
    - ' - '
    - ' | '
    - ' — '
    # HOW HARD TO PULL EACH PAGE. These are politeness and reliability
    # settings, not scoring.
    #   user_agent          EMPTY ON PURPOSE. Setting one has been measured to
    #                       lose sensors, not gain them.
    #   impersonate         TLS fingerprint. Enterprise proxies and TLS
    #                       inspection break this — first thing to test on a
    #                       new host.
    #   min_extracted_size  below this many characters the body is treated as
    #                       a failed extraction, and the item keeps its title
    #                       only.
    #   decode_google_news  Google News links are redirects; this resolves them
    #                       to the publisher so dedup and source rules work.
    #   gnews_interval      seconds between Google News requests specifically.
    fetch:
      user_agent: ''
      timeout: 20
      sleep_time: 1.0
      max_redirects: 5
      min_extracted_size: 80
      impersonate: chrome
      decode_google_news: true
      gnews_interval: 1

# ------------------------------------------------------------------------------
#  SENSORS - the whole feed list for this domain
#
#  Verify every URL against the collector host's own egress before adding;
#  some publishers refuse datacenter addresses that work from a browser.
# ------------------------------------------------------------------------------
  # ONE RECORD PER SOURCE. Adding one changes what is COLLECTED, never how it
  # scores. A record with no `url` stops the run with that record named, rather
  # than being skipped in silence.
  #
  #   url    required.
  #   kind   `feed` (the default) or `page`. THIS IS THE ONLY WAY TO WATCH A
  #          PORTAL. A feed is walked for items and each item is collected
  #          once. A page is re-read on EVERY run and identified by a hash of
  #          its text, so new material posted under an unchanging address is
  #          collected and an unchanged page saves nothing.
  #          It is opt-in for a reason: the collector also falls through to the
  #          page path whenever a HEALTHY feed returns no entries, and re-reading
  #          those every run would write a record each time an error page
  #          reflowed. So a portal has to say it is one.
  #   title  a page has no headline, and the scorer floors and flags an
  #          untitled record — so a `kind: page` source without this can never
  #          surface however fresh it is. Say what the page IS. Mind that the
  #          words you choose are matched by any rule using `scope: title`.
  #   group  a label for the health and yield tools. Not read when scoring.
  #   note   free text for whoever maintains the list.
  sensors:
  - url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    group: 'National: government / CERT / SLTT'
  - url: https://us-cert.cisa.gov/ncas/current-activity.xml
    group: 'National: government / CERT / SLTT'
  - url: https://www.cisecurity.org/feed/alert
    group: 'National: government / CERT / SLTT'
  - url: https://www.kb.cert.org/vulfeed
    group: 'National: government / CERT / SLTT'
  - url: https://www.nist.gov/blogs/cybersecurity-insights/rss.xml
    group: 'National: government / CERT / SLTT'
  - url: https://jvn.jp/en/rss/jvn.rdf
    group: 'National: government / CERT / SLTT'
  - url: https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
    group: 'National: vendor PSIRTs'
    note: MSRC update-guide RSS was dropped 2026-08-25. See the drop list above.
  - url: https://security.paloaltonetworks.com/rss.xml
    group: 'National: vendor PSIRTs'
  - url: https://www.fortiguard.com/rss/ir.xml
    group: 'National: vendor PSIRTs'
  - url: https://www.greynoise.io/blog/rss.xml
    group: 'National: exploitation evidence'
  - url: https://www.rapid7.com/blog/rss/
    group: 'National: exploitation evidence'
  - url: https://www.zerodayinitiative.com/rss/published/
    group: 'National: exploitation evidence'
  - url: https://blog.qualys.com/feed
    group: 'National: exploitation evidence'
  - url: https://therecord.media/feed/
    group: 'National: news / research'
  - url: https://unit42.paloaltonetworks.com/feed/
    group: 'National: news / research'
  - url: https://feeds.feedburner.com/TheHackersNews
    group: 'National: news / research'
  - url: https://isc.sans.edu/rssfeed_full.xml
    group: 'National: news / research'
  - url: https://www.schneier.com/feed/atom/
    group: 'National: news / research'
  - url: https://www.darkreading.com/rss.xml
    group: 'National: news / research'
  - url: https://securelist.com/feed/
    group: 'National: news / research'
