# ==============================================================================
#  STAGE 3a - PROCESSING
#
#  Deterministic. No model, no judgement, no tokens. Produces the staging
#  document. Score = highest qualifying tier weight, times the product of
#  any elevation multipliers. Tiers do not stack; multipliers do.
# ==============================================================================

#  ORDER OF OPERATIONS. Nothing outside this list changes a score:
#    1. TIERS          the FIRST tier whose `require` matches wins, and its
#                      `weight` becomes the score. Tiers do NOT stack — one
#                      tier per article.
#    2. MULTIPLIERS    every `when` that matches multiplies that score. These
#                      DO stack: two 1.5 factors make 2.25.
#    3. FLOORS         raise a score to a stated minimum, never lower one.
#    4. FORCE_SURFACE  ignores the score completely and puts the item in the
#                      document. The highest-cost position in this file.
#  settings.surface_min_score is the cut. Below it items go to the drop list,
#  which is PRINTED, never deleted.
#
#  READING A RULE — every rule is a tree of these atoms:
#    group:      is any term from this vocabulary group present?
#    scope:      WHERE to look.
#                  title  headline only
#                  text   body only
#                  blob   headline + body
#                  source feed URL and source label — the article's ORIGIN,
#                         not its content. "CISA ordered a patch" in a trade
#                         write-up is not the directive from cisa.gov.
#                THE DEFAULT DIFFERS BY ATOM: `group` defaults to blob,
#                `proximity` defaults to text. Always write it explicitly.
#    proximity:  are a term from group `a` and a term from group `b` within
#                `window` CHARACTERS of each other, measured both directions
#                from the a-term?
#                  all_occurrences  default false, which tests only the FIRST
#                                   occurrence of each a-term — so the same
#                                   word in boilerplate can mask a real hit.
#                                   Set it true unless you want the old
#                                   behaviour.
#                  max_occurrences  ceiling on that scan, default 40.
#                Terms are used VERBATIM here, padding included: ' calif ' and
#                'uc ' rely on their spaces to act as boundaries.
#    not:        inverts the atom beneath it — "match, unless".
#    any / all:  or / and. They nest.
#    always:     matches everything. Only the last tier should use it.
#  Rules name GROUPS, never raw words. Every word lives in scoring.groups.
scoring:
  # HIGHEST FIRST. Evaluation stops at the first match, so the order of this
  # list is meaning rather than tidiness — moving a tier up changes what wins.
  # The last tier should be `require: always` so nothing falls through
  # unscored.
  tiers:
  # Worked example — the atoms above, in the tier that matters most. Every
  # other tier and force-surface rule is built from the same pieces.
  - id: 1
    name: Direct impact to California organizations
    # Printed beside the item in the staging document so stage 3b can state
    # which requirement an item answers without re-deriving it. Identifiers
    # only: they must exist in the requirements tree, and nothing is
    # calculated from them. A tier with no `serves:` prints nothing.
    serves: PIR-1
    serves_sir: []
    # The score for anything this tier claims, before any multiplier.
    weight: 8.0
    require:
      all:
      - not:
          group: listicle
          scope: title
      # THE CYBER GATE. Carried by every tier 1-3 rule and every force-surface
      # rule. It adds no weight; it only refuses articles that use this
      # domain's words in a non-cyber sense. Removing it from one rule quietly
      # reopens that rule to homonyms.
      - group: cyber_context
        scope: blob
      - any:
        - all:
          - group: geo
            scope: title
          - group: incident
            scope: blob
        - all:
          - group: geo
            scope: blob
          - group: incident
            scope: blob
          - proximity:
              a: geo
              b: incident
              window: 120
  - id: 2
    name: SLTT sector targeting anywhere (leading indicator)
    serves: PIR-2
    serves_sir: []
    weight: 4.0
    require:
      all:
      - not:
          group: listicle
          scope: title
      - group: cyber_context
        scope: blob
      - any:
        - all:
          - group: sector
            scope: title
          - group: incident_broad
            scope: blob
        - proximity:
            a: sector
            b: incident_broad
            window: 80
            scope: blob
            all_occurrences: true
  - id: 3
    name: Actively-exploited vulnerabilities in SLTT-common technology
    serves: PIR-3
    serves_sir: []
    weight: 2.0
    require:
      all:
      - not:
          group: listicle
          scope: title
      - group: cyber_context
        scope: blob
      - group: exploit_strong
        scope: blob
      - group: lowmat_tech
        scope: blob
      - proximity:
          a: lowmat_tech
          b: exploit_strong
          window: 200
          scope: blob
          all_occurrences: true
  - id: 4
    name: Broad/national threats with SLTT relevance
    serves: PIR-4
    serves_sir: []
    weight: 1.0
    require: always
  # ELEVATION. Each matching factor multiplies the tier weight, and they STACK.
  # A multiplier cannot promote an item into a tier; it only makes a scored
  # item heavier. An item no tier rewarded stays cheap however many fire.
  multipliers:
  - name: KEV / actively exploited
    serves_sir: []
    factor: 1.5
    when:
      all:
      - not:
          group: listicle
          scope: title
      - group: exploit_strong
        scope: blob
      - any:
        - proximity:
            a: exploit_strong
            b: cve
            window: 200
            scope: blob
            all_occurrences: true
        - proximity:
            a: exploit_strong
            b: lowmat_tech
            window: 200
            scope: blob
            all_occurrences: true
  - name: low-maturity SLTT tech
    serves_sir:
    - SIR-2.2.1
    - SIR-3.2.1
    factor: 1.5
    when:
      all:
      - not:
          group: listicle
          scope: title
      - any:
        - group: lowmat_tech
          scope: title
        - proximity:
            a: lowmat_tech
            b: exploit_strong
            window: 200
            scope: blob
            all_occurrences: true
        - proximity:
            a: lowmat_tech
            b: incident_broad
            window: 120
            scope: blob
            all_occurrences: true
  - name: supply-chain / procurement
    serves_sir: []
    factor: 1.3
    when:
      all:
      - not:
          group: listicle
          scope: title
      - any:
        - group: supplychain
          scope: title
        - proximity:
            a: supplychain
            b: incident_broad
            window: 120
            scope: blob
            all_occurrences: true
  - name: ransomware vs public-sector/CI
    serves_sir: []
    factor: 1.3
    when:
      all:
      - not:
          group: listicle
          scope: title
      - proximity:
          a: ransom
          b: ci
          window: 150
          scope: blob
          all_occurrences: true
  # RAISE A SCORE TO A MINIMUM, never lower it. Deliberately weaker than
  # force-surface: the item becomes visible at the bottom of the surface rather
  # than guaranteed a place. For signals that are authoritative but of unproven
  # relevance to this domain.
  floors:
  - name: CISA directive on technology not on the SLTT list
    score: 2.0
    when:
      all:
      - not:
          group: listicle
          scope: title
      - group: cisa_source
        scope: source
      - group: exploit_strong
        scope: blob
      - not:
          group: lowmat_tech
          scope: blob
  # IMMUNE TO SCORE. If `when` matches, the item is in the document no matter
  # what it scored or where surface_min_score sits. This is the strongest
  # statement available in this file and the most expensive to get wrong —
  # every false positive here reaches the analyst's desk.
  # These rules deliberately mirror tiers 1-3 rather than inventing new logic,
  # so a change to a tier and its force-surface twin is one edit in two places.
  force_surface:
  - name: M1 in-AOR entity in an incident
    serves_sir: []
    when:
      all:
      - not:
          group: listicle
          scope: title
      - group: cyber_context
        scope: blob
      - any:
        - all:
          - group: geo
            scope: title
          - group: incident
            scope: blob
        - proximity:
            a: geo
            b: incident
            window: 120
            scope: blob
            all_occurrences: true
  - name: M2 exploited flaw affecting SLTT-relevant technology
    serves_sir:
    - SIR-3.2.1
    when:
      all:
      - not:
          group: listicle
          scope: title
      - group: cyber_context
        scope: blob
      - group: exploit_strong
        scope: blob
      - group: lowmat_tech
        scope: blob
      - proximity:
          a: lowmat_tech
          b: exploit_strong
          window: 200
          scope: blob
          all_occurrences: true
  - name: M3 SLTT sector in an incident
    serves_sir: []
    when:
      all:
      - not:
          group: listicle
          scope: title
      - group: cyber_context
        scope: blob
      - any:
        - all:
          - group: sector
            scope: title
          - group: incident_broad
            scope: blob
        - proximity:
            a: sector
            b: incident_broad
            window: 80
            scope: blob
            all_occurrences: true
  # ENGINE BEHAVIOUR THAT IS NOT A RULE.
  settings:
    # THE CUT. At or above this an item is a candidate; below it the item is
    # listed in the drop list with its score and reasoning. Raising this hides
    # tier-4 items entirely; lowering it floods the queue.
    surface_min_score: 2.0
    # A feed artifact with no title cannot be judged, so it is floored and
    # flagged rather than scored — it lands in the drop list where the source
    # can be checked.
    empty_title:
      score: 0.5
      tier: 4
      flag: 'FLAG: empty title (feed artifact - verify source)'
    # FLAGS, NEVER DROPS. An item outside this window still appears, marked
    # STALE. Collection's window_days and max_publish_age_days are what remove
    # things; this only annotates.
    recency:
      enabled: true
      window_days: 7
      # The cycle boundary: the most recent <weekday> at <time> in <timezone>
      # THAT HAS ALREADY PASSED.
      cutoff_weekday: wednesday
      # MUST BE AT OR BEFORE THE HOUR THE COLLECTOR STARTS. Because the engine
      # takes the most recent cutoff already passed, declaring a later time
      # silently returns LAST week's window — every week, with no error.
      # The timer fires 0400 local; this reads 04:00. Change one, change both.
      cutoff_time: 04:00
      # An IANA zone name. On Windows this needs the `tzdata` package — there
      # is no system timezone database, and without it the scorer will not
      # start at all.
      timezone: America/Los_Angeles
    # DISPLAY ONLY. Folds several outlets' coverage of one event into a single
    # block in the staging document. It changes no score, merges no item and
    # drops nothing.
    #   similarity         how alike two titles must be to cluster
    #   min_shared_tokens  floor on overlapping words, so short titles do not
    #                      cluster on nothing
    #   min_evidence       floor on how much INFORMATION the overlap carries,
    #                      so formulaic advisory titles that share many words
    #                      but say nothing distinctive stay apart
    #   max_group_size     past this the cluster is treated as template
    #                      matching, dissolved, and reported in the header
    #   max_group_display  how much of the document one group may occupy
    grouping:
      enabled: true
      similarity: 0.15
      min_shared_tokens: 3
      min_evidence: 8.0
      max_group_size: 25
      max_group_display: 12
  # WHOLE-WORD MATCHING, for terms that would otherwise match inside a longer
  # word. Terms of 4 characters or fewer get this automatically — this list is
  # for the LONGER ones that still need it: 'ransom' inside 'ransomware',
  # 'cisco' inside 'francisco'.
  # The reverse trap: a term of 4 characters or fewer is ALREADY whole-word, so
  # 'hack' does not match 'hacks'. Spell out every form you want, or use a stem
  # of 5+ characters.
  word_boundary_terms:
  - scada
  - ransom
  - cisco
  - how to
  - what is
  - hacker
  # THE VOCABULARY. Every word the scorer can see lives here; rules reference
  # these names and never a raw string.
  # Matching is case-insensitive substring for terms of 5+ characters, and
  # whole-word for 4 or fewer (or anything in word_boundary_terms above).
