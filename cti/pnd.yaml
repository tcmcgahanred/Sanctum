# ==============================================================================
#  STAGE 3b - EXPLOITATION
#
#  A person and a model working the staging document into the vox.
#  Only production.report_title is read by any engine; the rest is the
#  standard the analyst and the model are held to.
# ==============================================================================

#  MOST OF THIS BLOCK IS A STANDARD FOR PEOPLE, NOT A SETTING.
#  Read by an engine: report_title, show_scores, staging_annotations.
#  Everything else — audience, sections, the compliance checklist, notes — is
#  what the analyst and the model are held to when they build the vox.
production:
  audience: 'Low-maturity State/Local/Tribal/Territorial (SLTT) organisations in the AOR —
    counties, cities, school and special districts. They consume vendor software; they do
    not write code. Recommendations must be plain-language and minimal-tooling (IG1 CIS controls
    preferred), and lean on vendor accountability and procurement governance rather than engineering
    effort.

    '
  relevance_clause: 'Why an SLTT organization should care:'
  show_scores: true
  report_title: WCTI — Staging Document (candidate queue)
  vox_title: WCTI — Weekly Cyber Threat Intelligence
  distributed_item_target:
  - 5
  - 8
  sections:
  - NEWS
  - CTA TTPs
  - LATEST ATTACKS OR RISKS
  - KEYWORDS
  # HOW STAGE 3a PRE-SORTS CANDIDATES FOR 3b. First matching section wins, so
  # the order of this list matters and the last entry should be `when: always`.
  #   min_body_words  below this the item is listed without an annotation,
  #                   because there is not enough body text to summarise
  #                   honestly.
  staging_annotations:
    min_body_words: 40
    sections:
    - name: LATEST ATTACKS OR RISKS
      when:
        any:
        - group: exploit_strong
          scope: blob
        - group: cve
          scope: blob
    - name: CTA TTPs
      when:
        group: ttp
        scope: blob
    - name: NEWS
      when:
        group: incident_broad
        scope: blob
    - name: NEWS
      when: always
    compliance_checklist:
    - Every entry written from the article BODY, never the headline (§6.2).
    - One event, one entry - same-event reports folded, each event placed once (§7).
    - Every entry carries a 'why an SLTT organization should care' clause, framed as vendor
      accountability, procurement or IG1 controls (§6.3).
    - Citations nested per entry, as live links the reader can actually open (§6.5).
    - Serious-impact claims verified against a primary or authoritative source; wording does
      not inflate the source (§7).
    - 'Attribution discipline: suspected is not confirmed; the state of evidence is represented
      as it stands (§7).'
    - Out-of-window items either carry a fresh this-week hook or are cut - not silently kept
      (§7).
    - 'Audience-portfolio filter applied: developer-only and defence-industrial-only items
      excluded unless they reach SLTT through a vendor (§7).'
    - Product-specific items are relevant only if this audience uses the product (§7).
    - Acronyms spelled out on first use; mechanisms named but translated (§7).
    - All four sections present; an empty one says 'none this cycle' rather than being omitted
      (§5).
    - 'Three dates correct: title = distribution Thursday, ICOD in the header, LTIOV absent
      (§2).'
    - Staging draft carries no handling markings (§1).
    - Reader-facing heading is 'WCTI - Weekly Cyber Threat Intelligence'; the word 'vox' appears
      nowhere (§3).
  deliverable_name: WCTI_v[YYYYMMDD]
  notes: 'Staging document and vox are content only, no handling markings, and are UNCAPPED
    - the item count is an output of the scoring and force-surface rules, never a target (Vox
    Policy section 7). The distributed product narrows to 5-8 and adds handling markings,
    and is outside Sanctum''s scope. KEYWORDS is wave-tops, not items. Three dates on the
    distribution product: title = distribution (Thursday); ICOD line = collection cutoff (Wednesday
    0400 PT); LTIOV planning-only, never printed.

    '
