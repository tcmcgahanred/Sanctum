# ------------------------------------------------------------------------------
#  VOCABULARY - what each word group is FOR
#
#  Every group declares serves: [PIR-n] or a role. A group that decides
#  nothing must say why, or vocab_check reports it.
# ------------------------------------------------------------------------------
#  REVIEW STATE FOR THE WORD LISTS ABOVE — dates and requirement attribution,
#  not words. The words themselves live in scoring.groups.
#  A group named here that does not exist in scoring.groups is an error;
#  a group in scoring.groups with no entry here is a warning once any group
#  has one, so a domain that has never used the convention stays quiet.
vocab:
  # Default staleness horizon. A group may override it with its own
  # review_interval_days — fast-moving vocabulary deserves a shorter one.
  review_interval_days: 180
  groups:
    geo:
      reviewed: 2026-08-17
      review_interval_days: 180
      serves:
      - PIR-1
    incident:
      reviewed: 2026-08-24
      review_interval_days: 90
      serves:
      - PIR-1
    sector:
      reviewed: 2026-08-24
      serves:
      - PIR-2
    incident_broad:
      reviewed: 2026-08-24
      review_interval_days: 90
      serves:
      - PIR-2
    exploit_strong:
      reviewed: 2026-08-24
      review_interval_days: 90
      serves:
      - PIR-3
    lowmat_tech:
