# ==============================================================================
#  CTI - SANCTUM DOMAIN FILE
#
#  Everything this domain needs, in the order the intelligence cycle runs it.
#  The engines in core/ read this file. Comments are for whoever edits it.
#  
#  Dated history is NOT here - it is in CHANGELOG.yaml, keyed by the setting
#  each entry concerns. What survived the history is in README.md's tenets.
#  
#  A comment on a value says what BREAKS if you change it. Why we chose it
#  is in the changelog. If a sentence would read identically in another
#  domain's file, it belongs in core/README.md, not here.
# ==============================================================================

# ==============================================================================
#  STAGE 1 - PLANNING & DIRECTION
#
#  What we need to know, and where the machine keeps its things.
#  Changing a requirement here changes what the whole cycle is for.
# ==============================================================================

# ------------------------------------------------------------------------------
#  REQUIREMENTS - PIR / INDICATOR / SIR
#
#  The scope of the whole effort, and the only statement of it in this
#  repository: what cyber threats endanger California SLTT organizations and
#  the critical infrastructure they operate or depend on?
#
#  The chain follows Army ATP 2-01. A priority intelligence requirement asks a
#  question. An indicator STATES what would be true if the answer were yes. A
#  specific information requirement names a fact to go and collect.
#
#  HOW THIS TREE CONNECTS TO SCORING
#    pirs[]         the questions. They carry no weight and no tier. A
#                   requirement never points at an implementation; scoring
#                   points here, and never the other way round.
#    indicators[]   a statement, true or false, never a question.
#                   `satisfied_by: any` means its SIRs are alternative routes
#                   to one fact, so a missing one is thinner sourcing.
#                   `satisfied_by: all` means they are components, so a missing
#                   one is a real hole. A coverage report that ignores this
#                   calls both of them half answered and is wrong about one.
#    sirs[]         the fact to collect.
#                   `decidable: machine` - a scoring rule can find it.
#                   `decidable: analyst` - no vocabulary ever will. These must
#                   not be counted as collection gaps. An indicator is machine
#                   decidable only when every SIR under it is; that is computed,
#                   never stored twice.
#                   A scoring rule claims one by naming it in `serves_sir:`.
#
#  `serves_eei:` is still read as the former name for `serves_sir:`, so the
#  second domain keeps working untouched. Do not use it in a new rule.
#
#  Nothing else here is derived. `fact`, `sensor`, `standard`, `analytic` and
#  `note` are for the analyst and for whoever builds the next sensor.
#
#  Items marked `status: DRAFT` are wording proposed for review, not settled.
# ------------------------------------------------------------------------------
requirements:
  pirs:
  - id: PIR-1
    name: Direct impact to California organizations
    question: What incidents, breaches, or targeting have directly affected California-based organizations
      or entities?
    indicators:
    - id: IND-1.1
      statement: A California SLTT or critical-infrastructure organization reported a cyber incident
        this window.
      satisfied_by: any
      sirs:
      - id: SIR-1.1.1
        fact: Breach notifications affecting Californians (org, date, type, records).
        decidable: machine
        sensor:
          name: CA AG breach-registry scraper
          status: PENDING
        note: 'The collector no longer blocks this. A sensor record may declare ''kind: page'',
          which is re-read every run and identified by its contents rather than its URL, so a portal
          that posts new notifications under one unchanging address is collected. The scraper that
          turns registry rows into per-victim records is still to build, and the record should declare
          a ''title:'' or the scorer will floor it as untitled.'
      - id: SIR-1.1.2
        fact: Extortion or leak-site posts naming California victims.
        decidable: machine
        sensor:
          name: ransomware leak-site aggregator, CA-filtered
          status: PENDING
      - id: SIR-1.1.3
        fact: Regional or local press reports of incidents at California local government, school,
          utility or tribal entities.
        decidable: machine
        sensor:
          name: curated CA regional press
          status: PENDING
        note: StateScoop is SLTT trade press, not California regional press. This requirement remains
          unserved.
      - id: SIR-1.1.4
        fact: Official California advisories naming an affected California entity.
        decidable: machine
        sensor:
          name: Cal OES + CDT + MS-ISAC
          status: ACTIVE
          also: Cal-CSIC - PENDING
        note: 'Cal-CSIC remains unserved. It publishes, but as PDF or DOCX on an HTML index with
          no RSS. The collector blocker is gone: declare the index as ''kind: page'' and it is re-read
          every run. Reaching the advisories themselves still means parsing that index, or the documents
          behind it.'
    - id: IND-1.2
      statement: The reported impact is verified rather than merely claimed.
      satisfied_by: all
      sirs:
      - id: SIR-1.2.1
        fact: Confirmed disruption (systems down, public-safety or 911 impact, operational degradation),
          verified against a primary source.
        decidable: analyst
        standard: Verify specific impact claims before publishing. Soften or cut unverifiable specifics.
          Anti-FUD.
      - id: SIR-1.2.2
        fact: 'Attribution status: confirmed, suspected, or unknown.'
        decidable: analyst
        standard: Attribution discipline. Never state suspected as fact.
  - id: PIR-2
    name: SLTT sector targeting anywhere
    question: What threat activity is targeting SLTT-relevant sectors anywhere, as a leading indicator
      for California?
    indicators:
    - id: IND-2.1
      statement: An SLTT-relevant sector is under active targeting this window.
      satisfied_by: any
      sirs:
      - id: SIR-2.1.1
        fact: Reported attacks or targeting of a named SLTT sector, any geography.
        decidable: machine
        sensor:
          name: national trusted feeds + StateScoop
          status: ACTIVE
          also: K-12 Dive, WaterISAC - PENDING; GovTech - REJECTED
        note: GovTech advertises no working feed. Both candidate paths returned 0 entries and HTTP
          404. Do not retry without new evidence.
      - id: SIR-2.1.2
        fact: Sector ISAC or agency advisories (WaterISAC, MS-ISAC, CISA sector alerts).
        decidable: machine
        sensor:
          name: MS-ISAC + CISA (4 feeds)
          status: ACTIVE
          also: WaterISAC - PENDING
    - id: IND-2.2
      statement: The targeted technology or configuration is present in California SLTT organizations.
      satisfied_by: all
      sirs:
      - id: SIR-2.2.1
        fact: Whether the targeted technology or configuration is common in California SLTT organizations,
          for example internet-exposed PLCs in small water systems.
        decidable: analyst
        note: This is the leading-indicator logic. Out-of-state targeting matters because the same
          exposure exists here.
    - id: IND-2.3
      statement: The activity is a widening campaign rather than an isolated incident.
      satisfied_by: all
      sirs:
      - id: SIR-2.3.1
        fact: Multiple incidents sharing tactics, techniques and procedures, or sector, across geographies.
        decidable: analyst
        analytic: Convergence. Supports a widening-campaign framing, for example the multistate
          water attacks.
    - id: IND-2.4
      status: DRAFT
      statement: Election infrastructure is being targeted somewhere in the United States.
      satisfied_by: any
      sirs:
      - id: SIR-2.4.1
        fact: Reported attacks or targeting of election offices, election systems, or voter registration
          data, any geography.
        decidable: machine
        status: DRAFT
        sensor:
          name: national trusted feeds
          status: ACTIVE
      - id: SIR-2.4.2
        fact: Election-sector advisories from CISA or the Elections Infrastructure ISAC.
        decidable: machine
        status: DRAFT
        sensor:
          name: CISA (4 feeds)
          status: ACTIVE
          also: EI-ISAC - PENDING
  - id: PIR-3
    name: Actively-exploited vulnerabilities in SLTT-common technology
    question: What in-the-wild or KEV vulnerabilities affect technology common in low-maturity SLTT
      environments?
    indicators:
    - id: IND-3.1
      statement: A vulnerability is under active exploitation in the wild this window.
      satisfied_by: any
      sirs:
      - id: SIR-3.1.1
        fact: CISA KEV additions (CVE, date, exploitation status, ransomware-use flag).
        decidable: machine
        sensor:
          name: dedicated KEV feed
          status: ABSENT
        note: 'No dedicated KEV sensor. KEV additions reach the corpus only when an advisory or
          aggregator mentions them, which is the single-aggregator dependence the ICD 203 review
          flagged. Cheap to close: manifest.reference_lists.kev is already fetched and cached.'
      - id: SIR-3.1.2
        fact: Vendor PSIRT advisories confirming in-the-wild exploitation.
        decidable: machine
        sensor:
          name: vendor PSIRTs (Cisco, Palo Alto, Fortinet)
          status: ACTIVE
    - id: IND-3.2
      statement: The affected technology is present in low-maturity SLTT environments.
      satisfied_by: all
      sirs:
      - id: SIR-3.2.1
        fact: Whether the product is commonly deployed by SLTT organizations (edge appliances, on-prem
          SharePoint, RMM, routers).
        decidable: analyst
      - id: SIR-3.2.2
        fact: Which providers or versions are affected, and whether the audience uses them.
        decidable: analyst
        standard: Provider-dependent relevance. A webmail or product item is relevant only if it
          hits providers the audience runs, such as Google Workspace or Microsoft 365. MSP-only
          software is low-relevance if few organizations here use MSPs.
    - id: IND-3.3
      statement: A remediation path exists that the audience can act on.
      satisfied_by: all
      sirs:
      - id: SIR-3.3.1
        fact: Patch availability and KEV remediation deadline.
        decidable: analyst
        standard: 'Actionability. Frame as a vendor-accountability ask: confirm your vendor or IT
          provider patched X.'
  - id: PIR-4
    name: Broad or national threats with SLTT relevance
    question: What national-scale threats carry material relevance to SLTT defenders?
    indicators:
    - id: IND-4.1
      statement: A national-scale threat materially affects SLTT defenders.
      satisfied_by: all
      sirs:
      - id: SIR-4.1.1
        fact: National advisories or campaigns with an SLTT nexus.
        decidable: machine
        sensor:
          name: national feeds
          status: ACTIVE
      - id: SIR-4.1.2
        fact: 'Audience-portfolio relevance: does it reach the SLTT audience, or is it developer-only,
          defense-industrial-only, or vendor opinion?'
        decidable: analyst
        standard: Audience filter. Developer-targeted items such as npm poisoning and defense-industrial-base
          items such as CMMC are out of portfolio unless they reach SLTT through a vendor.
  - id: PIR-5
    status: DRAFT
    name: Adversary behaviour SLTT defenders should detect or hunt for
    question: What adversary behaviour should SLTT defenders detect or hunt for this cycle?
    note: 'DRAFT. Written to give the CTA TTPs section of the vox a requirement behind it, which
      it has never had. No scoring rule reads any of this yet: the `ttp` group holds 29 terms and
      no rule uses it, and no MITRE technique identifier appears anywhere in this file.'
    indicators:
    - id: IND-5.1
      status: DRAFT
      statement: Adversary behaviour is described specifically enough to act on.
      satisfied_by: any
      sirs:
      - id: SIR-5.1.1
        fact: A MITRE ATT&CK technique identifier in the reporting.
        decidable: machine
        status: DRAFT
        sensor:
          name: MITRE ATT&CK technique library
          status: ABSENT
        note: An identifier library, not a word list. Set membership, nothing to tune.
      - id: SIR-5.1.2
        fact: A named tactic, technique or procedure described in prose.
        decidable: analyst
        status: DRAFT
    - id: IND-5.2
      status: DRAFT
      statement: The activity is attributed to a named threat actor.
      satisfied_by: any
      note: DRAFT. Attribution is not a TTP and does not change what a defender detects. It is collected
        because it carries the reporting, not because it drives the outcome.
      sirs:
      - id: SIR-5.2.1
        fact: A MITRE ATT&CK group identifier, or a vendor group name.
        decidable: machine
        status: DRAFT
        sensor:
          name: MITRE ATT&CK group library
          status: ABSENT
      - id: SIR-5.2.2
        fact: A stated country of origin.
        decidable: machine
        status: DRAFT
        note: Ambiguous alone. A country name needs the cyber gate and attribution language in proximity,
          or it fires on trade reporting.
    - id: IND-5.3
      status: DRAFT
      statement: Adversary intent is identifiable from the reporting.
      satisfied_by: all
      sirs:
      - id: SIR-5.3.1
        fact: A stated goal, or an observed impact that indicates the objective.
        decidable: analyst
        status: DRAFT
    - id: IND-5.4
      status: DRAFT
      statement: Adversary capability is identifiable from the reporting.
      satisfied_by: any
      sirs:
      - id: SIR-5.4.1
        fact: A named tool used.
        decidable: machine
        status: DRAFT
        sensor:
          name: MITRE ATT&CK software library
          status: ABSENT
      - id: SIR-5.4.2
        fact: A named malware family.
        decidable: machine
        status: DRAFT
        sensor:
          name: MITRE ATT&CK software library
          status: ABSENT
      - id: SIR-5.4.3
        fact: Assessed sophistication, skill level, or modus operandi.
        decidable: analyst
        status: DRAFT
manifest:
  domain: cti
  base_dir: /opt/ravenor
  sensors_file: references/sensors.txt
  # WHERE COLLECTED ARTICLES LIVE, permanently. Nothing in Sanctum prunes the
  # corpus; scoring re-reads it, so a rule change can be re-run over history.
  #   backend: local   -> base_dir/corpus/<date>/
  #   backend: rclone  -> synced to rclone_remote, and rclone must be
  #                       configured on the collector host or collection fails.
  corpus:
    backend: rclone
    rclone_remote: gdrive:ravenor-corpus
  # EXTERNAL LISTS FETCHED AND CACHED at collection time, keyed by a pattern
  # found in the article. Available to the annotator; NOT wired into scoring —
  # nothing here changes a score today.
  #   json_path / key_field  where the identifiers sit in the downloaded JSON
  #   match_pattern          what to look for in an article to key against it
  #   cache_hours            re-download only when the cache is older than this
  reference_lists:
    kev:
      url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
      json_path: vulnerabilities
      key_field: cveID
      match_pattern: CVE-[0-9]{4}-[0-9]{4,7}
      cache_hours: 12
  # WHERE THE STAGE 3a DOCUMENT IS WRITTEN. {date} is the run date. This is the
  # handoff to 3b — if the push fails the run still produces the file locally.
  staging:
    backend: rclone
    rclone_remote: gdrive:ravenor-staging
    filename: WCTI_{date}_STAGING.md

# ------------------------------------------------------------------------------
#  STAGE 2 - COLLECTION
#
#  Where to look, how hard, and how far back. Trusted sources are ingested
#  wholesale; AOR relevance is decided later at scoring, never by filtering
#  here. A feed earns its place only if it is reliable AND additive.
# ------------------------------------------------------------------------------
  # THE TWO WINDOWS ARE NOT THE SAME WINDOW, and only one of them drops
  # anything. Confusing them is the most expensive mistake available here:
  #   window_days           how far back to GATHER from the corpus, by
  #                         COLLECTION date. Outside it, an item is absent.
  #   max_publish_age_days  refuses an item at collection when its PUBLISH date
  #                         is older than this. The only place Sanctum deletes
  #                         rather than flags. Reversible — a refused item is
  #                         not recorded as seen, so lifting this re-admits it.
  #   scoring.settings.recency is the third and mildest: it only FLAGS.
  collection:
    window_days: 7
    max_publish_age_days: 7
    # Titles shorter than this are treated as feed artifacts, not articles.
    min_title_len: 15
    # Publisher suffixes stripped from titles before deduplication, so
    # "Story - The Record" and "Story | The Record" count as one item.
    suffix_separators:
    - ' - '
    - ' | '
    - ' — '
    # HOW HARD TO PULL EACH PAGE. These are politeness and reliability
    # settings, not scoring.
    #   user_agent          EMPTY ON PURPOSE. Setting one has been measured to
    #                       lose sensors, not gain them.
    #   impersonate         TLS fingerprint. Enterprise proxies and TLS
    #                       inspection break this — first thing to test on a
    #                       new host.
    #   min_extracted_size  below this many characters the body is treated as
    #                       a failed extraction, and the item keeps its title
    #                       only.
    #   decode_google_news  Google News links are redirects; this resolves them
    #                       to the publisher so dedup and source rules work.
    #   gnews_interval      seconds between Google News requests specifically.
    fetch:
      user_agent: ''
      timeout: 20
      sleep_time: 1.0
      max_redirects: 5
      min_extracted_size: 80
      impersonate: chrome
      decode_google_news: true
      gnews_interval: 1

# ------------------------------------------------------------------------------
#  SENSORS - the whole feed list for this domain
#
#  Verify every URL against the collector host's own egress before adding;
#  some publishers refuse datacenter addresses that work from a browser.
# ------------------------------------------------------------------------------
  # ONE RECORD PER SOURCE. Adding one changes what is COLLECTED, never how it
  # scores. A record with no `url` stops the run with that record named, rather
  # than being skipped in silence.
  #
  #   url    required.
  #   kind   `feed` (the default) or `page`. THIS IS THE ONLY WAY TO WATCH A
  #          PORTAL. A feed is walked for items and each item is collected
  #          once. A page is re-read on EVERY run and identified by a hash of
  #          its text, so new material posted under an unchanging address is
  #          collected and an unchanged page saves nothing.
  #          It is opt-in for a reason: the collector also falls through to the
  #          page path whenever a HEALTHY feed returns no entries, and re-reading
  #          those every run would write a record each time an error page
  #          reflowed. So a portal has to say it is one.
  #   title  a page has no headline, and the scorer floors and flags an
  #          untitled record — so a `kind: page` source without this can never
  #          surface however fresh it is. Say what the page IS. Mind that the
  #          words you choose are matched by any rule using `scope: title`.
  #   group  a label for the health and yield tools. Not read when scoring.
  #   note   free text for whoever maintains the list.
  # COLLECTION POSTURE. Cast a wide net: any credible cyber-threat reporting is
  # in scope at collection, and relevance is decided at scoring, never by keyword
  # pre-filtering here. A trusted publisher is ingested wholesale. A search engine
  # is not a publisher, and a query is how you address one - which is why the
  # keyword-filtered Google News entries below do not break this rule.
  sensors:
  - url: https://www.cisa.gov/cybersecurity-advisories/all.xml
    group: 'National: government / CERT / SLTT'
  - url: https://us-cert.cisa.gov/ncas/current-activity.xml
    group: 'National: government / CERT / SLTT'
  - url: https://www.cisecurity.org/feed/alert
    group: 'National: government / CERT / SLTT'
  - url: https://www.kb.cert.org/vulfeed
    group: 'National: government / CERT / SLTT'
  - url: https://www.nist.gov/blogs/cybersecurity-insights/rss.xml
    group: 'National: government / CERT / SLTT'
  - url: https://jvn.jp/en/rss/jvn.rdf
    group: 'National: government / CERT / SLTT'
  - url: https://sec.cloudapps.cisco.com/security/center/psirtrss20/CiscoSecurityAdvisory.xml
    group: 'National: vendor PSIRTs'
    note: MSRC update-guide RSS was dropped 2026-08-25. See the drop list above.
  - url: https://security.paloaltonetworks.com/rss.xml
    group: 'National: vendor PSIRTs'
  - url: https://www.fortiguard.com/rss/ir.xml
    group: 'National: vendor PSIRTs'
  - url: https://www.greynoise.io/blog/rss.xml
    group: 'National: exploitation evidence'
  - url: https://www.rapid7.com/blog/rss/
    group: 'National: exploitation evidence'
  - url: https://www.zerodayinitiative.com/rss/published/
    group: 'National: exploitation evidence'
  - url: https://blog.qualys.com/feed
    group: 'National: exploitation evidence'
  - url: https://therecord.media/feed/
    group: 'National: news / research'
  - url: https://unit42.paloaltonetworks.com/feed/
    group: 'National: news / research'
  - url: https://feeds.feedburner.com/TheHackersNews
    group: 'National: news / research'
  - url: https://isc.sans.edu/rssfeed_full.xml
    group: 'National: news / research'
  - url: https://www.schneier.com/feed/atom/
    group: 'National: news / research'
  - url: https://www.darkreading.com/rss.xml
    group: 'National: news / research'
  - url: https://securelist.com/feed/
    group: 'National: news / research'
  - url: https://news.sophos.com/en-us/category/threat-research/feed/
    group: 'National: news / research'
  - url: https://www.crowdstrike.com/blog/feed/
    group: 'National: news / research'
  - url: https://www.recordedfuture.com/feed/
    group: 'National: news / research'
  - url: https://www.tenable.com/blog/feed
    group: 'National: news / research'
  - url: https://feeds.feedburner.com/hackread
    group: 'National: news / research'
  - url: https://feeds.feedburner.com/TroyHunt
    group: 'National: news / research'
  - url: https://www.infosecurity-magazine.com/rss/news/
    group: 'National: news / research'
  - url: https://cybersecuritynews.com/feed/
    group: 'National: news / research'
  - url: https://bartblaze.blogspot.com/feeds/posts/default
    group: 'National: news / research'
  - url: https://krebsonsecurity.com/feed/
    group: 'National: news / research'
  - url: https://googleprojectzero.blogspot.com/feeds/posts/default
    group: 'National: news / research'
  - url: https://www.bleepingcomputer.com/feed/
    group: 'National: news / research'
  - url: https://statescoop.com/feed/
    group: 'National: news / research'
  - url: https://www.securityweek.com/feed/
    group: 'National: news / research'
    note: 'Added 2026-08-23. Found by auditing which outlets a CyberWire daily roundup cited:
      five of ten stories came from these two, and neither was collected here. SecurityWeek:
      use the first-party path, not feeds.feedburner.com/securityweek (same content behind a
      302, and no reason to add a Feedburner dependency). NOTE: its feed window holds only 10
      items — safe while collection runs daily, not if that changes.'
  - url: https://www.theregister.com/security/headlines.atom
    group: 'National: news / research'
    note: 'The Register: SECTION feed only. The whole-site feed at /headlines.atom is a general
      tech magazine — git tooling, Microsoft trivia — and does not belong in this corpus.'
  - url: https://industrialcyber.co/feed/
    group: 'National: news / research'
  - url: https://www.huntress.com/blog/rss.xml
    group: 'National: vendor telemetry'
    note: 'Added 2026-08-23, every path verified from the collector host first. These vendors
      run incident response and sensor networks this effort will never have. When they publish,
      it is primary source. Marketing overhead is the price and the scorer sorts it out.  Huntress:
      SMB and MSP telemetry — the closest commercial visibility there is to a low-maturity SLTT
      environment. Its output lands directly on vocabulary already declared here: n-able, n-central,
      kaseya, connectwise, screenconnect in lowmat_tech; rmm, msp, managed service provider
      in supplychain. NOTE: the feed window is 680 items — the whole blog archive, served every
      fetch. That is a ONE-TIME intake, not a rate; steady state is a few a week. Roughly half
      the archive is company news and educational content, which will score low and drop. That
      was a decision, not an oversight.'
  - url: https://cloudblog.withgoogle.com/topics/threat-intelligence/rss/
    group: 'National: vendor telemetry'
    note: 'Google Threat Intelligence (absorbed Mandiant). Use the cloudblog host: the cloud.google.com
      path returns HTTP 200 with ZERO entries — live URL, no content, the exact failure the
      item count exists to catch.'
  - url: https://blog.talosintelligence.com/rss/
    group: 'National: vendor telemetry'
    note: Cisco Talos research. Distinct from the Cisco PSIRT advisory feed above — that is
      disclosures, this is investigation. First-party path, not the Feedburner mirror, which
      serves identical content.
  - url: https://www.microsoft.com/en-us/security/blog/feed/
    group: 'National: vendor telemetry'
    note: Microsoft Threat Intelligence. Distinct from the MSRC feed above, which is the patch
      catalogue. Low volume and a real marketing fraction — the weakest of these four and the
      first to drop at review. The old msrc-blog host is dead.
  - url: https://haveibeenpwned.com/feed/breaches/
    group: 'National: breach registry'
    note: 'Named-victim breach disclosure. Low volume (~2-3 per cycle). NOTE: the item date
      is the date the breach was LOADED, not the date it happened, so the recency gate will
      not flag a years-old breach loaded yesterday. The first sentence of every description
      states the actual breach month — read it.'
  - url: https://www.news.caloes.ca.gov/feed/
    group: 'Regional AOR: official sources (example: California)'
  - url: https://www.cdt.ca.gov/newsroom/feed/
    group: 'Regional AOR: official sources (example: California)'
  - url: https://www.californiacitynews.org/taxonomy/term/1717/feed
    group: 'Regional AOR: municipal press (example: California)'
    note: 'California City News, cybersecurity section. EXPECTED YIELD IS ~3 ITEMS PER YEAR:
      12 items span Sep 2022 to Mar 2026. A column of `0 new of 12 returned` in the log is NORMAL
      for this sensor and is not a failure — it serves its whole back catalogue every fetch.
      Kept because nothing else here emits a named California municipal victim (Long Beach,
      El Cerrito, Contra Costa), and because it carries local-government policy items — closed-session
      law, grant programs — that no general news query surfaces. Review yield 2026-11-23.'
  - url: https://news.google.com/rss/search?q=%22California%22%20(ransomware%20OR%20%22data%20breach%22%20OR%20cyberattack)%20when%3A7d&hl=en-US&gl=US&ceid=US:en
