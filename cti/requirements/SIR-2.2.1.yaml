# ------------------------------------------------------------------------------
#  SIR-2.2.1 · The targeted technology is present in California SLTT organizations
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be
#  worked off rather than excused.
#
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-2.2.1
title: The targeted technology is of a kind commonly exposed in low-maturity public-sector
  environments
status: draft
modified: '2026-09-25'
fact: 'The targeted technology or configuration is of a kind commonly exposed in low-maturity
  public-sector environments: internet-exposed industrial controllers, unmanaged edge devices,
  end-of-life network equipment, on-premises collaboration servers. Whether any particular
  organization runs it is not asked here and is not knowable from reporting.'
logsource:
  scope: any
  kind: any
detection:
  technology:
    group: lowmat_tech
    scope: title
  incident:
    group: incident
    scope: blob
  listicle:
    group: listicle
    scope: title
  technology_near_incident:
    proximity:
      a: technology
      b: incident
      window: 200
      scope: blob
      all_occurrences: true
  condition: technology and technology_near_incident and not listicle
falsepositives:
- 'MULTI-STORY ROUNDUPS AND WEEKLY RECAPS. Two of the 25 headlines read on 2026-09-25 were
  digests rather than reports: "ThreatsDay: 296K IoT Botnet, 100+ Water Systems Targeted,
  SharePoint RCE Chain + 27 New Stories" and "Weekly Recap: Chinese Spy Proxy, AI Agents Go
  Off-Task, Router Backdoors and More". The `listicle` list catches `top 5` and `top 10` and
  does not catch `weekly recap`, `threatsday` or `+ N new stories`. A digest names five technologies
  and is about none of them.'
- 'A PROPER NOUN THAT CONTAINS A TECHNOLOGY WORD. `router` is six characters, so it matches
  inside longer words rather than on a boundary, and it fired twice on the seized attack platform
  named QTRouter: "DOJ, FBI seize China-linked QScan and QTRouter platforms" and "FBI Seizes
  China-Linked Hacking Platforms QScan and QTRouter". QTRouter is a tool used BY the adversary,
  not a class of equipment the audience operates.'
- A VENDOR SCHEDULING ANNOUNCEMENT. "Cisco Advance Notification for Publication of September
  2, 2026, Security Advisories" names the vendor in the headline and carries advisory language
  in the body, but announces that advisories WILL be published. There is no vulnerability
  and no incident in it.
- NOT A FALSE POSITIVE BUT IT INFLATES THE COUNT, so read it here before trusting 124 as an
  event count. The sample of 25 held one SonicWall SMA1000 zero-day story four times and one
  Fire Ant Cisco router story five times. Roughly a third of that sample was two events. The
  grouping step folds same-event reports in the staging document; this requirement counts
  articles.
note: 'This is the leading-indicator logic, and the rewording restores it. Out-of-state targeting
  matters because the same CLASS of exposure exists here, not because we know a particular
  county owns the box. The old wording asked for an audience inventory across 16 critical
  infrastructure sectors, which is not maintainable and would be wrong the week after it was
  written. TIGHTENED 2026-09-25 after measurement, and the measurement is why this rule reads
  the way it does. Proximity alone could not carry it: `lowmat_tech` beside `incident_broad`
  within 200 characters matched 542 of 2,834 articles, 19.1 percent, which is what the bare
  word list returned and therefore no gate at all. An 80-character window gave 397, the narrow
  `incident` list gave 444, both together gave 301. Requiring the technology in the HEADLINE
  is what broke it: 154 alone, and 124 with the narrow proximity as well, which is 4.4 percent
  and sits inside the normal band for this domain. THE COST IS RECALL, and it is accepted
  deliberately: an article headlined ''Ransomware hits county'' that names Fortinet only in
  the body does not match. IND-2.2 rests on this single requirement, so its share of the corpus
  IS the indicator''s share, and a tenth of everything collected would have meant nothing.'
