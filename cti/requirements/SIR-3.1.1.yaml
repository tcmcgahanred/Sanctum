# ------------------------------------------------------------------------------
#  SIR-3.1.1 · A vulnerability added to the CISA known exploited catalogue
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but no sensor reaches it yet
#           draft       the wording is proposed, not settled
#           analyst     no expression will ever answer it, and it is therefore
#                       NOT a collection gap
#
#  `decidable: machine` carries a `detection:` block or it is not finished.
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-3.1.1
title: A vulnerability added to the CISA known exploited catalogue
status: unsupported
modified: '2026-09-24'
fact: CISA KEV additions (CVE, date, exploitation status, ransomware-use flag).
decidable: machine
logsource:
  scope: national
  kind: exploitation_evidence
sensor:
  name: dedicated KEV feed
  status: ABSENT
detection:
  cve:
    pattern: \bCVE-\d{4}-\d{4,7}\b
    scope: blob
  exploited:
    keywords:
    - actively exploited
    - exploited in the wild
    - in-the-wild
    - under active exploitation
    - added to its known exploited
    - added to the known exploited
    - kev catalog
    - cisa kev
    - exploitation in the wild
    - weaponized exploit
    - public proof-of-concept
    - proof-of-concept exploit
    - exploit code is available
    - being exploited
    - active threat
    - active exploitation
    - ongoing exploitation
    - observed exploitation
    - actively targeting
    scope: blob
  cve_near_exploited:
    proximity:
      a: cve
      b: exploited
      window: 200
      scope: blob
      all_occurrences: true
  condition: cve_near_exploited
fix: 'FIXED 2026-09-25. The condition read `cve and exploited`, which fired on any article carrying a vulnerability identifier anywhere and exploitation language anywhere, unrelated: 235 matches in 30 days. It now requires them within 200 characters of each other. The proper detector is membership in the CISA catalogue, which is already fetched every twelve hours and wired to nothing; this proximity is a proxy for it.'
note: 'No dedicated KEV sensor. KEV additions reach the corpus only when an advisory or aggregator
  mentions them, which is the single-aggregator dependence the ICD 203 review flagged. Cheap
  to close: manifest.reference_lists.kev is already fetched and cached. WRITTEN for this requirement
  and NOT yet measured against the corpus. Run tools/requirement_coverage.py on Ravenor to
  see what it matches before trusting the count.'
