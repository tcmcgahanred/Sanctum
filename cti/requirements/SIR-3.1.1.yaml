# ------------------------------------------------------------------------------
#  SIR-3.1.1 · A vulnerability added to the CISA known exploited catalogue
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-3.1.1
title: A vulnerability added to the CISA known exploited catalogue
status: stable
modified: '2026-09-25'
fact: CISA KEV additions (CVE, date, exploitation status, ransomware-use flag).
logsource:
  scope: national
  kind: exploitation_evidence
sensor:
  name: dedicated KEV feed
  status: ABSENT
detection:
  identifier:
    group: vuln_id
    scope: blob
  exploited:
    group: exploit_strong
    scope: blob
  id_near_exploited:
    proximity:
      a: identifier
      b: exploited
      window: 200
      scope: blob
      all_occurrences: true
  condition: id_near_exploited
note: 'No dedicated KEV sensor. KEV additions reach the corpus only when an advisory or aggregator
  mentions them, which is the single-aggregator dependence the ICD 203 review flagged. Cheap
  to close: manifest.reference_lists.kev is already fetched and cached. WRITTEN for this requirement
  and NOT yet measured against the corpus. Run tools/requirement_coverage.py on Ravenor to
  see what it matches before trusting the count.'
fix: 'FIXED 2026-09-25. The condition read `cve and exploited`, which fired on any article
  carrying a vulnerability identifier anywhere and exploitation language anywhere, unrelated:
  235 matches in 30 days. It now requires them within 200 characters of each other. The proper
  detector is membership in the CISA catalogue, which is already fetched every twelve hours
  and wired to nothing; this proximity is a proxy for it.'
