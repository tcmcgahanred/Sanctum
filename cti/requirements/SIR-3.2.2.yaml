# ------------------------------------------------------------------------------
#  SIR-3.2.2 · The affected providers or versions reach this audience
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be
#  worked off rather than excused.
#
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-3.2.2
title: The reporting names the specific affected products and versions
status: draft
modified: '2026-09-25'
fact: The reporting names the specific affected products and, where stated, the affected versions,
  so a reader can check their own inventory.
logsource:
  scope: any
  kind: any
detection:
  product:
    group: lowmat_tech
    scope: blob
  version:
    group: version_scope
    scope: blob
  listicle:
    group: listicle
    scope: title
  product_near_version:
    proximity:
      a: product
      b: version
      window: 200
      scope: blob
      all_occurrences: true
  condition: product_near_version and not listicle
standard: State the affected products and versions plainly, and name the provider where the
  reporting names one, so a reader can check it against their own inventory. Do NOT assert
  that the audience uses them - that is the reader's check, and it is why this requirement
  was split.
note: 'SPLIT 2026-09-25 by Planning and Direction decision. The old wording asked two questions
  at once: which products and versions are affected, and whether the audience uses them. The
  first is in the reporting and is what the brief must state. The second is the READER''S
  check against their own inventory and is not a collection requirement at all. Only the first
  half survives here. REWORDED 2026-09-25 and NOT yet measured against the corpus. Run tools/requirement_coverage.py
  on Ravenor before trusting the count.'
