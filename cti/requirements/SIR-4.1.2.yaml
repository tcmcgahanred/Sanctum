# ------------------------------------------------------------------------------
#  SIR-4.1.2 · The reporting is inside this audience's portfolio
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-4.1.2
title: The reporting is inside this audience's portfolio
status: draft
modified: '2026-09-25'
fact: 'The reporting is not confined to an audience this brief does not serve: developer-only
  software supply chain, defense-industrial-base compliance, or vendor marketing.'
logsource:
  scope: any
  kind: any
detection:
  cyber:
    group: cyber_context
    scope: blob
  out_of_portfolio:
    group: out_of_portfolio
    scope: blob
  listicle:
    group: listicle
    scope: title
  condition: cyber and not out_of_portfolio and not listicle
standard: Audience filter. Developer-targeted items such as npm poisoning and defense-industrial-base
  items such as CMMC are out of portfolio unless they reach SLTT through a vendor.
note: 'A portfolio SCOPE filter, not an ownership question - that is the Planning and Direction
  distinction that kept this requirement alive. It sits under a satisfied_by: all indicator
  beside SIR-4.1.1, so it narrows rather than surfaces. UNRESOLVED TENSION, recorded rather
  than hidden: `npm` and `pypi` live in `supplychain`, a relevance signal, and a developer-only
  registry story is out of portfolio. The exclusion list therefore carries neither, and a
  developer-only npm story will still pass this filter. Vendor marketing is not reliably detectable
  by words and is not attempted. REWORDED 2026-09-25 and NOT yet measured against the corpus.
  Run tools/requirement_coverage.py on Ravenor before trusting the count.'
