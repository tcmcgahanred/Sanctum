# ------------------------------------------------------------------------------
#  SIR-3.2.1 · The product is commonly deployed by SLTT organizations
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be
#  worked off rather than excused.
#
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-3.2.1
title: The affected product is of a kind commonly deployed in low-maturity public-sector environments
status: draft
modified: '2026-09-25'
fact: 'The affected product is of a kind commonly deployed in low-maturity public-sector environments:
  edge appliances, on-premises collaboration servers, remote monitoring and management tools,
  consumer-grade network equipment. Whether the audience runs it is not asked here.'
logsource:
  scope: any
  kind: any
detection:
  product:
    group: lowmat_tech
    scope: blob
  identifier:
    group: vuln_id
    scope: blob
  listicle:
    group: listicle
    scope: title
  product_near_identifier:
    proximity:
      a: product
      b: identifier
      window: 200
      scope: blob
      all_occurrences: true
  condition: product_near_identifier and not listicle
note: Gated on the product appearing beside a vulnerability identifier rather than anywhere
  in the body. The bare word list matched 555 of 2,919 articles in 30 days, 19 percent, which
  is why it is a gate and never a standalone answer. REWORDED 2026-09-25 and NOT yet measured
  against the corpus. Run tools/requirement_coverage.py on Ravenor before trusting the count.
