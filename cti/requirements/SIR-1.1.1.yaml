# ------------------------------------------------------------------------------
#  SIR-1.1.1 · A breach notification naming a California organization
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be
#  worked off rather than excused.
#
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-1.1.1
title: A breach notification naming a California organization
status: unsupported
modified: '2026-09-25'
fact: Breach notifications affecting Californians (org, date, type, records).
logsource:
  scope: regional
  kind: breach_registry
sensor:
  name: CA AG breach-registry scraper
  status: PENDING
detection:
  california:
    group: geo
    scope: blob
  notification:
    keywords:
    - breach notification
    - notice of data breach
    - notice of a data breach
    - notifying individuals
    - notification letter
    - sample notice
    - attorney general
    - records affected
    - individuals affected
    - personal information was
    - consumers affected
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  condition: california and notification and cyber
note: 'The collector no longer blocks this. A sensor record may declare ''kind: page'', which
  is re-read every run and identified by its contents rather than its URL, so a portal that
  posts new notifications under one unchanging address is collected. The scraper that turns
  registry rows into per-victim records is still to build, and the record should declare a
  ''title:'' or the scorer will floor it as untitled. WRITTEN for this requirement and NOT
  yet measured against the corpus. Run tools/requirement_coverage.py on Ravenor to see what
  it matches before trusting the count.'
