# ------------------------------------------------------------------------------
#  SIR-2.5.2 · The affected system is public safety or criminal justice technology
#
#  PIR-2: SLTT sector targeting anywhere (What threat activity is targeting
#         SLTT-relevant sectors anywhere, as a leading indicator for
#         California?)
#  IND-2.5: A law enforcement, dispatch, court or corrections organization, or
#           the technology it runs on, is under active targeting this window.
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-2.5.2
title: The affected system is public safety or criminal justice technology
status: draft
modified: '2026-10-20'
fact: 'A breach, exposure, exploited vulnerability or outage affects a kind of technology
  used by law enforcement, dispatch or corrections: computer-aided dispatch, records management,
  license plate readers, body cameras, emergency notification, jail management or inmate
  communications, a state or national criminal justice information system, or a vendor
  whose business is that technology. Whether any particular agency runs it is not asked
  here.'
logsource:
  scope: any
  kind: any
detection:
  # A PROPOSAL. This detector has not met the corpus. Measure it with
  # tools/requirement_coverage.py --domain cti --sir SIR-2.5.2 over two
  # windows and read the matched headlines before changing status.
  #
  # The vendor names are a CLASS, public safety technology vendors that serve
  # agencies nationally. They are not an inventory of one customer.
  technology:
    keywords:
    - computer-aided dispatch
    - dispatch system
    - records management system
    - license plate reader
    - alpr
    - body camera
    - body-worn camera
    - bodycam
    - emergency notification
    - ng911
    - next generation 911
    # THE CRIMINAL JUSTICE INFORMATION SYSTEMS, moved here from SIR-2.5.1 on
    # 2026-10-02. They were declared as organization names there, and they are
    # not organizations: a headline naming either means the system or its data.
    # `ncic` is four characters, so the engine word-boundaries it on its own.
    - clets
    - ncic
    - jail management
    - inmate phone
    - inmate tablet
    - prison tablet
    - video visitation
    - mark43
    - flock safety
    - axon
    - evidence.com
    - motorola
    - centralsquare
    - tyler tech
    - versaterm
    - carbyne
    - rapidsos
    - codered
    - crisis24
    - securus
    - viapath
    - global tel
    - pay tel
    - jpay
    - cellebrite
    # COMPUTER-AIDED DISPATCH AND RECORDS MANAGEMENT PRODUCTS, added 2026-10-13
    # at the owner's request and shipped 2026-10-20. Written in the form
    # headlines use, not full corporate form: `motorola solutions` became
    # `motorola` and `tyler technologies` became `tyler tech`. Bare `tyler` was
    # not used because it matches the city of Tyler, Texas. `octave` was not
    # added: the Hexagon spin-off under that name is not confirmed complete and
    # the word also names GNU Octave. UNMEASURED COLLISION RISK on three terms:
    # `motorola` (phones), `hexagon` (industrial software advisories) and `rims`
    # (the Risk and Insurance Management Society).
    - premierone
    - spillman
    - commandcentral
    - tritech
    - superion
    - zuercher
    - new world systems
    - hexagon
    - hxgn
    - intergraph
    - sun ridge systems
    - rims
    - caliber public safety
    scope: title
  incident:
    group: incident
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  listicle:
    group: listicle
    scope: title
  condition: cyber and technology and incident and not listicle
falsepositives:
- EXPECTED, NOT YET MEASURED. Vendor product and funding announcements that name the vendor
  in the headline and mention security in the body.
- EXPECTED, NOT YET MEASURED. Privacy and policy stories about license plate readers or Flock
  that carry the word 'breach' or 'data' without a cyber incident.
note: 'Written 2026-09-30 to support the Alameda County Sheriff''s Office threat brief on 28
  October 2026. It asks what KIND of technology is affected, consistent with the 2026-09-25
  decision that a requirement never asks whether the audience owns the technology.'
