# ------------------------------------------------------------------------------
#  SIR-5.2.2 · A stated country of origin
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-5.2.2
title: A stated country of origin
status: draft
modified: '2026-09-25'
fact: A stated country of origin.
logsource:
  scope: any
  kind: any
detection:
  country:
    keywords:
    - china
    - chinese
    - russia
    - russian
    - iran
    - iranian
    - north korea
    - north korean
    - dprk
    - belarus
    - belarusian
    scope: blob
  attribution:
    keywords:
    - state-sponsored
    - state sponsored
    - nation-state
    - nation state
    - attributed to
    - attribution to
    - linked to
    - tied to
    - backed hackers
    - backed group
    - backed actors
    - government hackers
    - intelligence service
    - apt
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  country_near_attribution:
    proximity:
      a: country
      b: attribution
      window: 100
      scope: blob
      all_occurrences: true
  condition: cyber and country_near_attribution
falsepositives:
- A country name in trade or geopolitical reporting with no attribution language nearby. This
  is why the term cannot stand alone.
note: Ambiguous alone. A country name needs the cyber gate and attribution language in proximity,
  or it fires on trade reporting. WRITTEN for this requirement and NOT yet measured against
  the corpus. Run tools/requirement_coverage.py on Ravenor to see what it matches before trusting
  the count.
