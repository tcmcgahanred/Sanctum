# ------------------------------------------------------------------------------
#  SIR-2.4.1 · Reported targeting of election infrastructure
#
#  PIR-2: SLTT sector targeting anywhere (What threat activity is targeting
#         SLTT-relevant sectors anywhere, as a leading indicator for
#         California?)
#  IND-2.4: Election infrastructure is being targeted somewhere in the United
#           States.
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-2.4.1
title: Reported targeting of election infrastructure
status: draft
modified: '2026-10-02'
fact: Reported attacks or targeting of election offices, election systems, or voter registration
  data, any geography.
logsource:
  scope: any
  kind: any
detection:
  election:
    group: election
    scope: blob
  incident:
    group: incident_broad
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  listicle:
    group: listicle
    scope: title
  election_near_incident:
    proximity:
      a: election
      b: incident
      window: 120
      scope: blob
      all_occurrences: true
  condition: cyber and election_near_incident and not listicle
note: WRITTEN for this requirement and NOT yet measured against the corpus. Run tools/requirement_coverage.py
  on Ravenor to see what it matches before trusting the count.
