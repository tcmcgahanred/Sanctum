# ------------------------------------------------------------------------------
#  SIR-2.1.1 · Reported targeting of a named SLTT sector
#
#  PIR-2: SLTT sector targeting anywhere (What threat activity is targeting
#         SLTT-relevant sectors anywhere, as a leading indicator for
#         California?)
#  IND-2.1: An SLTT-relevant sector is under active targeting this window.
#
#  `status:`, its precedence, and how to write one of these live once in
#  requirements/_tree.yaml.
# ------------------------------------------------------------------------------

id: SIR-2.1.1
title: Reported targeting of a named SLTT sector
status: stable
modified: '2026-10-02'
fact: Reported attacks or targeting of a named SLTT sector, any geography.
logsource:
  scope: national
  kind: press
detection:
  sector:
    group: sector
    scope: title
  sector_anywhere:
    group: sector
    scope: blob
  incident:
    group: incident_broad
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  listicle:
    group: listicle
    scope: title
  sector_near_incident:
    proximity:
      a: sector_anywhere
      b: incident
      window: 80
      scope: blob
      all_occurrences: true
  condition: cyber and ((sector and incident) or sector_near_incident) and not listicle
falsepositives:
- An Australian hotel with a water park, matched on a sector word with no cyber context.
note: GovTech advertises no working feed. Both candidate paths returned 0 entries and HTTP
  404. Do not retry without new evidence. COPIED from the tier 2 scoring expression, term
  for term, and proven the same way.
