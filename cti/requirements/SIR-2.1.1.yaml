# ------------------------------------------------------------------------------
#  SIR-2.1.1 · Reported targeting of a named SLTT sector
#
#  One requirement, one file. Copy the closest existing rule rather than
#  starting from a skeleton; the one you copy is live and tested.
#
#  status   stable      finished, and something collects for it
#           unsupported finished, but its `logsource:` matches no sensor in
#                       the manifest, so nothing can ever reach it
#           draft       the wording is proposed, not settled
#           blocked     a machine could decide it, but the input it needs does
#                       not exist yet. `blocked_by:` names that input.
#
#  When more than one fits, the precedence is blocked, then unsupported, then
#  draft, then stable.
#
#  EVERY requirement is machine decidable. There is no value that parks one
#  permanently. A requirement with no `detection:` block is either a detector
#  nobody has written or a named missing input, and both are meant to be
#  worked off rather than excused.
#
#  `falsepositives:` records what WILL match and should not. Write it here,
#  beside the rule, not in a changelog nobody reads beside the rule.
# ------------------------------------------------------------------------------
id: SIR-2.1.1
title: Reported targeting of a named SLTT sector
status: stable
modified: '2026-09-25'
fact: Reported attacks or targeting of a named SLTT sector, any geography.
logsource:
  scope: national
  kind: press
sensor:
  name: national trusted feeds + StateScoop
  status: ACTIVE
  also: K-12 Dive, WaterISAC - PENDING; GovTech - REJECTED
detection:
  sector:
    group: sector
    scope: title
  sector_anywhere:
    group: sector
    scope: blob
  incident:
    group: incident_broad
    scope: blob
  cyber:
    group: cyber_context
    scope: blob
  listicle:
    group: listicle
    scope: title
  sector_near_incident:
    proximity:
      a: sector_anywhere
      b: incident
      window: 80
      scope: blob
      all_occurrences: true
  condition: cyber and ((sector and incident) or sector_near_incident) and not listicle
falsepositives:
- An Australian hotel with a water park, matched on a sector word with no cyber context.
note: GovTech advertises no working feed. Both candidate paths returned 0 entries and HTTP
  404. Do not retry without new evidence. COPIED from the tier 2 scoring expression, term
  for term, and proven the same way.
